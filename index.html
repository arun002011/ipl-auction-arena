<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPL Mega Auction Arena</title>
  <style>
    :root{--navy:#07132f;--navy2:#10234d;--orange:#ff6b24;--gold:#ffd166;--bg:#f0f4f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#16a34a;--red:#dc2626}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;padding-bottom:100px}
    header{background:linear-gradient(135deg,var(--navy),#1e3a8a);color:#fff;padding:16px max(18px,calc((100% - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--orange);box-shadow:0 4px 12px #0000001a;position:sticky;top:0;z-index:40}
    .brand{font-weight:900;font-size:22px;letter-spacing:.5px}
    .brand span{color:var(--gold)}
    .headmeta{font-size:13px;color:#cbd5ee;background:#ffffff15;padding:4px 12px;border-radius:20px}
    main{max-width:1240px;margin:22px auto;padding:0 16px}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 25px -5px #0f172a0d}
    .full{grid-column:1/-1}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
    .title{font-size:24px;margin:0 0 8px;font-weight:800;color:var(--navy)}
    .muted{color:var(--muted)}
    .field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;margin:5px 0 12px;color:var(--text)}
    .btn{border:0;border-radius:10px;background:var(--orange);color:white;font-weight:800;padding:12px 18px;font:inherit;cursor:pointer;box-shadow:0 4px 12px #ff6b2430;transition:all .15s ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px #ff6b2445}
    .btn.secondary{background:#f1f5f9;color:var(--text);box-shadow:none}
    .btn.dark{background:var(--navy2);color:#fff}
    .btn.danger{background:var(--red)}
    .btn.success{background:var(--green)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    /* TEAM SELECTOR BADGE GRID */
    .team-select-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:16px}
    .team-badge-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;transition:all .2s ease;position:relative}
    .team-badge-card:hover{border-color:var(--orange);transform:translateY(-2px)}
    .team-badge-card.claimed{opacity:0.6;cursor:not-allowed;background:#f8fafc}
    .team-avatar-text{width:64px;height:64px;border-radius:50%;color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 4px 10px #0000001a}
    .team-code{font-size:18px;font-weight:900;color:var(--navy)}
    .team-name{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;text-transform:uppercase}

    /* RETENTION DASHBOARD */
    .retention-header-bar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:20px}
    .retention-title{font-size:32px;font-weight:900;color:var(--navy);line-height:1.1}
    .retention-title span{color:var(--orange);display:block}
    
    .purse-floating-card{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;text-align:right;min-width:200px}
    .purse-floating-card .label{font-size:10px;font-weight:800;color:#cbd5ee;letter-spacing:1px}
    .purse-floating-card .val{font-size:28px;font-weight:900;color:var(--gold);margin:2px 0}

    .retention-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .stat-box{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px}
    .stat-box.rtm{background:var(--orange);color:#fff;border-color:var(--orange)}
    .stat-box .title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
    .stat-box.rtm .title{color:#fff0e6}
    .stat-box .num{font-size:26px;font-weight:900;color:var(--navy)}
    .stat-box.rtm .num{color:#fff}

    .slab-info-banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;font-size:12px;color:#1e40af;margin-bottom:20px;display:flex;align-items:center;gap:8px}

    /* PLAYER RETENTION GRID */
    .core-players-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .core-player-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;position:relative;cursor:pointer;transition:all .2s ease;text-align:center}
    .core-player-card:hover{border-color:#cbd5e1;transform:translateY(-2px)}
    .core-player-card.selected{border-color:var(--orange);background:#fffcf9;box-shadow:0 4px 15px #ff6b2420}
    .badge-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:#e2e8f0;color:var(--navy);margin-bottom:8px}
    .badge-tag.uncapped{background:#fef3c7;color:#78350f}
    .p-title{font-size:15px;font-weight:900;color:var(--navy)}
    .p-sub{font-size:12px;color:var(--muted);font-weight:700}

    /* STICKY BOTTOM BAR */
    .sticky-bottom-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:30px;padding:10px 24px;display:flex;align-items:center;gap:20px;box-shadow:0 10px 25px #00000040;z-index:100;width:min(90%, 800px);justify-content:space-between}
    .sticky-bottom-bar .info{font-size:13px;font-weight:800}
    .sticky-bottom-bar .info b{color:var(--gold)}

    /* ADMIN COMMAND PORTAL */
    .admin-portal-card{background:#0d182e;color:#fff;border:2px solid var(--orange);border-radius:16px;padding:18px;margin-top:16px}
    .admin-portal-card .admin-title{font-size:13px;font-weight:900;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

    /* AUCTION ARENA */
    .playerhero{background:linear-gradient(140deg,#091532,#18336a);color:#fff;border-radius:16px;padding:24px;position:relative;overflow:hidden;box-shadow:0 12px 30px #09153230}
    .playername{font-size:clamp(26px,3.5vw,36px);font-weight:900;margin:6px 0}
    .bidamount{font-size:clamp(34px,5vw,48px);font-weight:1000;color:var(--gold);margin:10px 0}
    .tablewrap{overflow:auto;max-height:380px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0}
    .log{max-height:190px;overflow:auto;font-size:13px}
    .log div{padding:6px 0;border-bottom:1px dashed var(--line)}
    .notice{font-size:13px;padding:12px;border-radius:10px;background:#fef3c7;color:#78350f;margin-top:12px;border:1px solid #fde68a}
    .badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:800;background:#e2e8f0;color:var(--navy)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .strength-bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:4px}
    .strength-fill{height:100%;background:var(--green);width:0%}
    .roomcode{font-size:32px;font-weight:1000;letter-spacing:4px;color:var(--orange)}
    .squad-inspector{margin-top:15px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
    
    @media(max-width:850px){.layout{grid-template-columns:1fr}.team-select-grid{grid-template-columns:repeat(2,1fr)}.core-players-grid{grid-template-columns:repeat(2,1fr)}.retention-stats-row{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}}
  </style>
</head>

  const realPlayersMasterList = [
    {n:"Rishabh Pant",r:"WK",c:"IN",b:200,s:"M1"},{n:"Shreyas Iyer",r:"BAT",c:"IN",b:200,s:"M1"},{n:"KL Rahul",r:"WK",c:"IN",b:200,s:"M1"},

  function generateCode() { return Math.random().toString(36).substring(2, 7).toUpperCase(); }

  async function createRoom() {
    const userName = document.getElementById('displayNameInput').value.trim() || "Host";
    const code = generateCode();
    const initialTeams = {};

    TEAMS.forEach(t => {
      let defaultRetain = t.pool.slice(0, 3).map((p, idx) => ({ ...p, cost: p.uncapped ? UNCAPPED_PRICE : RETENTION_SLABS[idx] }));
      let spent = defaultRetain.reduce((acc, p) => acc + p.cost, 0);
      
      initialTeams[t.id] = { 
        claimedBy: null, 
        userName: "AI Franchise", 
        purse: 12000 - spent, 
        rtmCards: 6 - defaultRetain.length,
        players: defaultRetain.map(r => ({ name: r.name, cost: r.cost, country: r.country || "IN", role: r.role, type: "Retention" })), 
        retainedList: defaultRetain 
      };
    });

    const roomData = {
      code: code,
      hostId: currentUser.uid,
      hostName: userName,
      status: "TEAM_SELECT",
      paused: false,
      teams: initialTeams,
      currentPlayerIndex: 0,
      currentBid: PLAYERS[0].base,
      currentBidder: null,
      logs: ["IPL Room created. Step 1: Select Your Franchise."]
    };

    await db.collection("rooms").doc(code).set(roomData);
    listenToRoom(code);
  }

  async function joinRoom() {
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!code) return alert("Enter Room Code");
    const snap = await db.collection("rooms").doc(code).get();
    if (snap.exists) listenToRoom(code);
    else alert("Room not found");
  }

  function listenToRoom(code) {
    currentRoomId = code;
    if (unsubscribeRoom) unsubscribeRoom();
    unsubscribeRoom = db.collection("rooms").doc(code).onSnapshot(doc => {
      if (doc.exists) {
        const roomData = doc.data();
        renderRoom(roomData);
        if (roomData.status === "AUCTION" && roomData.hostId === currentUser.uid && !roomData.paused) {
          triggerAILogic(roomData);
        }
      }
    });
  }

  async function claimTeamAndEnterRetention(teamId) {
    const name = document.getElementById('displayNameInput')?.value || "User";
    const ref = db.collection("rooms").doc(currentRoomId);
    await ref.update({
      [`teams.${teamId}.claimedBy`]: currentUser.uid,
      [`teams.${teamId}.userName`]: name,
      status: "RETENTION",
      logs: firebase.firestore.FieldValue.arrayUnion(`${name} claimed ${teamId} and entered Retentions.`)
    });
  }

  /* STRICT OFFICIAL RETENTION LOGIC ENFORCEMENT */
  async function toggleRetention(teamId, playerObj) {
    const snap = await db.collection("rooms").doc(currentRoomId).get();
    const team = snap.data().teams[teamId];
    
    let currentRetain = team.retainedList || [];
    let exists = currentRetain.some(p => p.name === playerObj.name);

    if (!exists) {
      if (currentRetain.length >= 6) {
        alert("BCCI Rule Violation: Maximum 6 total retentions allowed per franchise!");
        return;
      }
      const currentCapped = currentRetain.filter(p => !p.uncapped).length;
      const currentUncapped = currentRetain.filter(p => p.uncapped).length;

      if (!playerObj.uncapped && currentCapped >= 5) {
        alert("BCCI Rule Violation: Maximum 5 CAPPED retentions allowed!");
        return;
      }
      if (playerObj.uncapped && currentUncapped >= 2) {
        alert("BCCI Rule Violation: Maximum 2 UNCAPPED retentions allowed!");
        return;
      }
    }

    let updatedRetain = exists ? currentRetain.filter(p => p.name !== playerObj.name) : [...currentRetain, playerObj];
    
    // Recalculate descending price slabs
    let cappedIdx = 0;
    let spent = 0;
    updatedRetain = updatedRetain.map((p) => {
      let cost = p.uncapped ? UNCAPPED_PRICE : RETENTION_SLABS[Math.min(cappedIdx++, 4)];
      spent += cost;
      return { ...p, cost: cost };
    });

    let newPurse = 12000 - spent;
    let rtmCards = 6 - updatedRetain.length;

    await db.collection("rooms").doc(currentRoomId).update({
      [`teams.${teamId}.retainedList`]: updatedRetain,
      [`teams.${teamId}.players`]: updatedRetain.map(r => ({ name: r.name, cost: r.cost, country: r.country || "IN", role: r.role, type: "Retention" })),
      [`teams.${teamId}.purse`]: newPurse,
      [`teams.${teamId}.rtmCards`]: rtmCards
    });
  }

  async function clearAllRetentions(teamId) {
    await db.collection("rooms").doc(currentRoomId).update({
      [`teams.${teamId}.retainedList`]: [],
      [`teams.${teamId}.players`]: [],
      [`teams.${teamId}.purse`]: 12000,
      [`teams.${teamId}.rtmCards`]: 6
    });
  }

  async function startMainAuction() {
    const ref = db.collection("rooms").doc(currentRoomId);
    await ref.update({
      status: "AUCTION",
      logs: firebase.firestore.FieldValue.arrayUnion("Retentions finalized! Main Auction Started.")
    });
  }

  async function placeBid(overrideTeam = null) {
    const snap = await db.collection("rooms").doc(currentRoomId).get();
    const data = snap.data();

    if (data.paused) return alert("Auction is paused by Admin!");

    let targetTeam = overrideTeam;
    if (!targetTeam) {
      for (const [tid, t] of Object.entries(data.teams)) {
        if (t.claimedBy === currentUser.uid) targetTeam = tid;
      }
    }

    if (!targetTeam) return alert("Spectators cannot bid! Claim a team first.");

    let teamData = data.teams[targetTeam];
    if (teamData.players.length >= 25) return alert("Squad limit reached (25 players)!");

    let increment = data.currentBid < 1000 ? 20 : 50;
    let nextBid = data.currentBidder ? data.currentBid + increment : data.currentBid;

    if (teamData.purse < nextBid) return alert("Insufficient purse!");

    await db.collection("rooms").doc(currentRoomId).update({
      currentBid: nextBid,
      currentBidder: targetTeam,
      logs: firebase.firestore.FieldValue.arrayUnion(`${targetTeam} bid ₹${nextBid} Lakhs`)
    });
  }

  function triggerAILogic(data) {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(async () => {
      const p = PLAYERS[data.currentPlayerIndex];
      if (!p) return;

      const increment = data.currentBid < 1000 ? 20 : 50;
      const nextBid = data.currentBidder ? data.currentBid + increment : data.currentBid;

      let eligibleAIs = [];
      Object.entries(data.teams).forEach(([tid, t]) => {
        if (!t.claimedBy && tid !== data.currentBidder) {
          const squad = t.players || [];
          const overseasCount = squad.filter(sp => sp.country === "Overseas").length;

          if (squad.length < 25 && t.purse >= nextBid) {
            if (p.country !== "Overseas" || overseasCount < 8) {
              let maxValuation = Math.max(p.base * 3, 600);
              if (nextBid <= maxValuation) {
                eligibleAIs.push(tid);
              }
            }
          }
        }
      });

      if (eligibleAIs.length > 0) {
        let chosenAI = eligibleAIs[Math.floor(Math.random() * eligibleAIs.length)];
        await placeBid(chosenAI);
      }
    }, 2000);
  }

  /* ADMIN PORTAL FUNCTIONS */
  async function adminSellPlayer() {
    const ref = db.collection("rooms").doc(currentRoomId);
    const snap = await ref.get();
    const data = snap.data();
    const p = PLAYERS[data.currentPlayerIndex];

    if (!data.currentBidder) return alert("No bids placed yet!");

    let winningTeam = data.currentBidder;
    let finalCost = data.currentBid;
    let nextIdx = data.currentPlayerIndex + 1;
    let nextPlayer = PLAYERS[nextIdx] || PLAYERS[0];

    let updatedPlayers = [...data.teams[winningTeam].players, { name: p.name, cost: finalCost, country: p.country, role: p.role, type: "Auction" }];
    let updatedPurse = data.teams[winningTeam].purse - finalCost;

    await ref.update({
      [`teams.${winningTeam}.players`]: updatedPlayers,
      [`teams.${winningTeam}.purse`]: updatedPurse,
      currentPlayerIndex: nextIdx,
      currentBid: nextPlayer.base,
      currentBidder: null,
      logs: firebase.firestore.FieldValue.arrayUnion(`SOLD! ${p.name} to ${winningTeam} for ₹${finalCost} Lakhs.`)
    });
  }

  async function adminUnsoldPlayer() {
    const ref = db.collection("rooms").doc(currentRoomId);
    const snap = await ref.get();
    const data = snap.data();

    let nextIdx = data.currentPlayerIndex + 1;
    let nextPlayer = PLAYERS[nextIdx] || PLAYERS[0];

    await ref.update({
      currentPlayerIndex: nextIdx,
      currentBid: nextPlayer.base,
      currentBidder: null,
      logs: firebase.firestore.FieldValue.arrayUnion(`UNSOLD! ${PLAYERS[data.currentPlayerIndex].name} marked unsold.`)
    });
  }

  async function adminJumpToPlayer() {
    const selectEl = document.getElementById('adminJumpSelect');
    if (!selectEl) return;
    const targetIdx = parseInt(selectEl.value);
    const ref = db.collection("rooms").doc(currentRoomId);
    const nextPlayer = PLAYERS[targetIdx];

    await ref.update({
      currentPlayerIndex: targetIdx,
      currentBid: nextPlayer.base,
      currentBidder: null,
      logs: firebase.firestore.FieldValue.arrayUnion(`ADMIN JUMP: Set player to ${nextPlayer.name} (Base ₹${nextPlayer.base}L).`)
    });
  }

  async function adminTogglePause() {
    const ref = db.collection("rooms").doc(currentRoomId);
    const snap = await ref.get();
    const isPaused = !!snap.data().paused;

    await ref.update({
      paused: !isPaused,
      logs: firebase.firestore.FieldValue.arrayUnion(`ADMIN: Auction ${!isPaused ? 'PAUSED' : 'RESUMED'}`)
    });
  }

  function calculateTeamStrength(players) {
    if (!players || players.length === 0) return 10;
    let roles = { BAT: 0, BOWL: 0, AR: 0, WK: 0 };
    players.forEach(p => { if (roles[p.role] !== undefined) roles[p.role]++; });

    let balanceScore = Math.min(roles.BAT, 4) * 10 + Math.min(roles.BOWL, 4) * 10 + Math.min(roles.AR, 2) * 15 + Math.min(roles.WK, 1) * 20;
    let sizeScore = Math.min(players.length / 18, 1) * 30;

    return Math.min(Math.round(balanceScore * 0.7 + sizeScore), 100);
  }

  function renderRoom(data) {
    const app = document.getElementById('app');
    const isAdmin = data.hostId === currentUser.uid;

    let myTeam = null;
    for (const [tid, t] of Object.entries(data.teams)) {
      if (t.claimedBy === currentUser.uid) myTeam = tid;
    }

    const userRole = isAdmin ? "ADMIN / HOST" : myTeam ? `OWNER (${myTeam})` : "SPECTATOR";
    document.getElementById('headerStatus').innerText = `Room: ${data.code} | Role: ${userRole}`;

    if (data.status === "TEAM_SELECT") {
      /* STEP 2: FRANCHISE BADGE SELECTION (NO IMAGES) */
      app.innerHTML = `
        <section class="card full">
          <div class="eyebrow">STEP 1 OF 2</div>
          <h2 class="title" style="font-size:30px;">Select Your Franchise</h2>
          <p class="muted">Choose a franchise to enter the Core Squad Retentions dashboard.</p>

          <div class="team-select-grid">
            ${TEAMS.map(t => {
              const td = data.teams[t.id];
              const isClaimed = !!td.claimedBy;
              const isMine = td.claimedBy === currentUser.uid;

              return `
                <div class="team-badge-card ${isClaimed ? 'claimed' : ''}" onclick="${!isClaimed || isMine ? `claimTeamAndEnterRetention('${t.id}')` : ''}">
                  <div class="team-avatar-text" style="background:${t.color}">${t.id}</div>
                  <div class="team-code">${t.id}</div>
                  <div class="team-name">${t.name}</div>
                  <div style="margin-top:10px;font-size:11px;font-weight:800;color:${isClaimed ? 'var(--orange)' : 'var(--green)'}">
                    ${isMine ? 'YOUR TEAM' : isClaimed ? `Taken (${td.userName})` : 'SELECT TEAM →'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </section>
      `;
    } else if (data.status === "RETENTION") {
      /* STEP 3: MOCKAUCTION RETENTION DASHBOARD CONCEPT */
      const myTeamObj = TEAMS.find(t => t.id === myTeam) || TEAMS[0];
      const myTeamData = data.teams[myTeamObj.id] || {};
      const retainList = myTeamData.retainedList || [];
      
      const totalCount = retainList.length;
      const cappedCount = retainList.filter(p => !p.uncapped).length;
      const uncappedCount = retainList.filter(p => p.uncapped).length;
      const rtmCards = 6 - totalCount;

      let spentLakhs = retainList.reduce((acc, p) => acc + (p.cost || 0), 0);
      let remainingCr = ((12000 - spentLakhs) / 100).toFixed(1);
      let spentCr = (spentLakhs / 100).toFixed(1);

      app.innerHTML = `
        <div class="layout">
          <section class="card full">
            <div class="retention-header-bar">
              <div>
                <div class="eyebrow">${myTeamObj.name} (${myTeamObj.id})</div>
                <h1 class="retention-title">Build Your <span>CORE SQUAD</span></h1>
                <p class="muted">Select up to 6 players to retain from your 10-player retention pool.</p>
              </div>

              <div class="purse-floating-card">
                <div class="label">REMAINING PURSE</div>
                <div class="val">₹${remainingCr} <small style="font-size:16px;">Cr</small></div>
                <div class="label">TOTAL: 120.0 CR</div>
              </div>
            </div>

            <div class="retention-stats-row">
              <div class="stat-box">
                <div class="title">TOTAL SLOTS</div>
                <div class="num">${totalCount} <small style="font-size:16px;color:var(--muted)">/ 6</small></div>
              </div>
              <div class="stat-box">
                <div class="title">✓ CAPPED</div>
                <div class="num">${cappedCount} <small style="font-size:16px;color:var(--muted)">/ 5</small></div>
              </div>
              <div class="stat-box">
                <div class="title">☆ UNCAPPED</div>
                <div class="num">${uncappedCount} <small style="font-size:16px;color:var(--muted)">/ 2</small></div>
              </div>
              <div class="stat-box rtm">
                <div class="title">RTM STRATEGY</div>
                <div class="num">${rtmCards} CARDS</div>
                <div style="font-size:10px;font-weight:700;margin-top:2px;">Available for Auction</div>
              </div>
            </div>

            <div class="slab-info-banner">
              <span>ⓘ</span>
              <div><b>SLAB SYSTEM:</b> Capped players follow descending purse deduction (18, 14, 11, 18, 14 Cr). Uncapped players are fixed at 4 Cr.</div>
            </div>

            <div class="core-players-grid">
              ${myTeamObj.pool.map(p => {
                const isSelected = retainList.some(r => r.name === p.name);
                return `
                  <div class="core-player-card ${isSelected ? 'selected' : ''}" onclick="toggleRetention('${myTeamObj.id}',${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <span class="badge-tag ${p.uncapped ? 'uncapped' : ''}">${p.uncapped ? 'UNCAPPED' : 'CAPPED'}</span>
                    <div class="p-title">${p.name}</div>
                    <div class="p-sub">${p.role}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>

        <div class="sticky-bottom-bar">
          <div class="info">SPENT: <b>₹${spentCr} Cr</b></div>
          <div class="info">REMAINING: <b>₹${remainingCr} Cr</b></div>
          <button class="btn" onclick="startMainAuction()">FINALIZE CORE →</button>
          <button class="btn secondary" onclick="clearAllRetentions('${myTeamObj.id}')">SKIP ALL RETENTIONS</button>
        </div>
      `;
    } else if (data.status === "AUCTION") {
      /* STEP 4: LIVE AUCTION ARENA WITH DEDICATED ADMIN PORTAL */
      const p = PLAYERS[data.currentPlayerIndex];
      const selectedInspectorTeam = document.getElementById('inspectorSelect')?.value || (myTeam || "CSK");
      const inspectorSquad = data.teams[selectedInspectorTeam]?.players || [];

      app.innerHTML = `
        <div class="layout">
          <section class="card">
            <div class="playerhero">
              <span class="badge">${p.set} SET</span>
              <div class="playername">${p.name}</div>
              <div class="muted" style="color:#cbd5ee">${p.role} · ${p.country} · Base Price: ₹${p.base} L</div>
              <div class="bidamount">₹${data.currentBid} Lakhs</div>
              <div><b>Highest Bidder:</b> ${data.currentBidder ? (data.teams[data.currentBidder].claimedBy ? data.currentBidder + " (User)" : data.currentBidder + " (AI)") : 'No Bids Yet'}</div>
            </div>

            <div class="actions">
              ${myTeam ? `<button class="btn" onclick="placeBid()">Bid ₹${data.currentBidder ? (data.currentBid < 1000 ? data.currentBid + 20 : data.currentBid + 50) : data.currentBid} L</button>` : `<button class="btn secondary" disabled>Spectating Only</button>`}
            </div>

            ${isAdmin ? `
              <div class="admin-portal-card">
                <div class="admin-title">⚡ ADMIN COMMAND PORTAL</div>
                <div class="admin-grid">
                  <button class="btn success" onclick="adminSellPlayer()">Sell to Highest Bidder</button>
                  <button class="btn danger" onclick="adminUnsoldPlayer()">Pass / Unsold</button>
                  <button class="btn dark" onclick="adminTogglePause()">${data.paused ? '▶ Resume Bidding' : '⏸ Pause Auction'}</button>
                  <button class="btn secondary" onclick="adminJumpToPlayer()">Jump To Selected</button>
                </div>

                <div style="margin-top:10px;">
                  <label style="font-size:11px;font-weight:700;color:#cbd5ee;">CALL SPECIFIC PLAYER:</label>
                  <select id="adminJumpSelect" class="field" style="margin-top:4px;margin-bottom:0;background:#1e293b;color:#fff;border-color:#334155;">
                    ${PLAYERS.map((pl, idx) => `<option value="${idx}" ${idx === data.currentPlayerIndex ? 'selected' : ''}>[#${idx+1}] ${pl.name} (${pl.role} - ₹${pl.base}L)</option>`).join('')}
                  </select>
                </div>
              </div>
            ` : ''}

            <div class="squad-inspector">
              <div class="eyebrow">${isAdmin ? 'ADMIN SQUAD INSPECTOR' : 'SQUAD INSPECTOR'}</div>
              <select id="inspectorSelect" class="field" style="margin-bottom:8px;" onchange="renderRoom(lastRoomData)">
                ${TEAMS.map(t => `<option value="${t.id}" ${t.id === selectedInspectorTeam ? 'selected' : ''}>${t.name} (${data.teams[t.id].players.length} Players)</option>`).join('')}
              </select>

              <div class="tablewrap" style="max-height:180px;">
                <table>
                  <thead><tr><th>Player</th><th>Role</th><th>Country</th><th>Price</th><th>Type</th></tr></thead>
                  <tbody>
                    ${inspectorSquad.length > 0 ? inspectorSquad.map(sp => `
                      <tr>
                        <td><b>${sp.name}</b></td>
                        <td>${sp.role}</td>
                        <td>${sp.country}</td>
                        <td>₹${sp.cost} L</td>
                        <td><span class="badge">${sp.type}</span></td>
                      </tr>
                    `).join('') : '<tr><td colspan="5" class="muted">No players in squad yet.</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="eyebrow">LIVE STANDINGS & OVERSEAS TRACKER</div>
            <div class="tablewrap">
              <table>
                <thead>
                  <tr>
                    <th>Team</th>
                    <th>Type</th>
                    <th>Purse Left</th>
                    <th>Squad</th>
                    <th>Overseas</th>
                    <th>Strength</th>
                  </tr>
                </thead>
                <tbody>
                  ${TEAMS.map(t => {
                    const teamObj = data.teams[t.id];
                    const squad = teamObj.players || [];
                    const overseasCount = squad.filter(sp => sp.country === "Overseas").length;
                    const strength = calculateTeamStrength(squad);
                    return `
                      <tr>
                        <td><b>${t.id}</b></td>
                        <td><small>${teamObj.claimedBy ? 'User' : 'AI'}</small></td>
                        <td>₹${(teamObj.purse / 100).toFixed(2)} Cr</td>
                        <td>${squad.length}/25</td>
                        <td><span style="color:${overseasCount >= 8 ? 'var(--red)' : 'var(--text)'}">${overseasCount}/8</span></td>
                        <td>
                          <b>${strength}%</b>
                          <div class="strength-bar"><div class="strength-fill" style="width:${strength}%"></div></div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <div class="sectiontitle" style="margin-top:15px;">Live Feed</div>
            <div class="log">${(data.logs||[]).slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div>
          </section>
        </div>
      `;
    }
  }
  let lastRoomData = null;
  const originalRenderRoom = renderRoom;
  renderRoom = function(d) { lastRoomData = d; originalRenderRoom(d); };
</script>
</body>
</html>
