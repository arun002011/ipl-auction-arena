<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPL 2026 Mega Auction - MockAuction.in</title>
  <style>
    :root {
      --bg-dark: #0a1120;
      --card-bg: #111a2e;
      --card-border: #1e293b;
      --accent-orange: #ff6b24;
      --gold: #ffd166;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --blue-glow: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-white);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background: rgba(10, 17, 32, 0.9);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .brand { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
    .brand span { color: var(--accent-orange); }

    main { max-width: 1280px; margin: 30px auto; padding: 0 20px; }

    /* STEP 1: FRANCHISE SELECTOR GRID */
    .section-title-wrap { text-align: center; margin-bottom: 30px; }
    .page-title { font-size: 38px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; }
    .page-title span { color: var(--accent-orange); }
    .page-subtitle { color: var(--text-muted); font-size: 15px; }

    .team-select-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }
    .team-select-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }
    .team-select-card:hover {
      border-color: var(--blue-glow);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.25);
    }
    .team-select-card.selected {
      border-color: var(--blue-glow);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      background: linear-gradient(180deg, #162444 0%, var(--card-bg) 100%);
    }
    .team-select-card.selected::after {
      content: '✓';
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--blue-glow);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .team-logo-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .team-logo-circle img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .team-code { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
    .team-full-name { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-top: 4px; text-transform: uppercase; }

    /* STEP 2: RETENTION DASHBOARD */
    .retention-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .retention-headline { font-size: 46px; font-weight: 900; line-height: 1.1; }
    .retention-headline span { color: var(--accent-orange); display: block; }
    
    .purse-box {
      background: #0f1a30;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 24px;
      text-align: right;
      min-width: 220px;
    }
    .purse-label { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; }
    .purse-value { font-size: 32px; font-weight: 900; color: var(--green); margin: 4px 0; }
    .purse-total { font-size: 11px; color: var(--text-muted); font-weight: 700; }

    /* STAT CARDS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
    }
    .stat-card.rtm-card {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
    }
    .stat-header { font-size: 12px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .rtm-card .stat-header { color: rgba(255, 255, 255, 0.85); }
    .stat-num { font-size: 36px; font-weight: 900; margin-top: 10px; }
    .rtm-subtitle { font-size: 12px; font-weight: 700; margin-top: 4px; opacity: 0.9; }

    /* SLAB NOTICE */
    .slab-notice {
      background: #0d182b;
      border: 1px solid #1e2e4a;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .slab-notice b { color: #60a5fa; }

    /* PLAYER CARDS GRID */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    .player-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .player-card:hover { transform: translateY(-4px); border-color: #334155; }
    .player-card.selected {
      border-color: var(--accent-orange);
      background: linear-gradient(180deg, #241618 0%, var(--card-bg) 100%);
    }
    .player-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #1e293b;
      margin: 0 auto 12px;
      overflow: hidden;
      border: 2px solid var(--card-border);
    }
    .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .type-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      background: #1e293b;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .p-name { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
    .p-role { font-size: 12px; color: var(--text-muted); font-weight: 700; }

    /* FLOATING BOTTOM BAR */
    .bottom-sticky-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 40px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .spent-info { font-size: 13px; font-weight: 800; color: var(--text-muted); }
    .spent-info span { color: var(--accent-orange); margin-left: 4px; font-size: 15px; }
    .remaining-info { font-size: 13px; font-weight: 800; color: var(--text-muted); }
    .remaining-info span { color: var(--green); margin-left: 4px; font-size: 15px; }

    .btn-finalize {
      background: var(--accent-orange);
      color: #fff;
      border: 0;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 36, 0.4);
      transition: all 0.2s ease;
    }
    .btn-finalize:hover { transform: scale(1.03); }
    .btn-skip {
      background: #1e293b;
      color: #fff;
      border: 0;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 1024px) {
      .team-select-grid, .players-grid { grid-template-columns: repeat(3, 1fr); }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .team-select-grid, .players-grid { grid-template-columns: repeat(2, 1fr); }
      .bottom-sticky-bar { flex-direction: column; width: 90%; border-radius: 20px; gap: 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">MOCK<span>AUCTION</span>.IN</div>
  <div style="font-size: 13px; color: var(--text-muted); font-weight: 700;">IPL 2026 MEGA AUCTION</div>
</header>

<main id="app">
  <!-- Rendered dynamically -->
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyApyrrX6gwt5MXD5Pu6TmnewBNtuDVKHVo",
    authDomain: "ipl-arena-2bdcc.firebaseapp.com",
    projectId: "ipl-arena-2bdcc",
    storageBucket: "ipl-arena-2bdcc.firebasestorage.app",
    messagingSenderId: "795621438551",
    appId: "1:795621438551:web:4faeb0d0d98e6487d81f12"
  };

  const TEAMS = [
    { id: "CSK", name: "Chennai Super Kings", logo: "https://upload.wikimedia.org/wikipedia/en/2/2b/Chennai_Super_Kings_Logo.svg", pool: [{name:"MS Dhoni",role:"WICKETKEEPER",uncapped:true},{name:"Ruturaj Gaikwad",role:"BATTER"},{name:"Ravindra Jadeja",role:"ALL-ROUNDER"},{name:"Shivam Dube",role:"ALL-ROUNDER"},{name:"Matheesha Pathirana",role:"BOWLER"},{name:"Devon Conway",role:"BATTER"}] },
    { id: "MI", name: "Mumbai Indians", logo: "https://upload.wikimedia.org/wikipedia/en/c/cd/Mumbai_Indians_Logo.svg", pool: [{name:"Jasprit Bumrah",role:"BOWLER"},{name:"Suryakumar Yadav",role:"BATTER"},{name:"Hardik Pandya",role:"ALL-ROUNDER"},{name:"Rohit Sharma",role:"BATTER"},{name:"Tilak Varma",role:"BATTER"},{name:"Naman Dhir",role:"ALL-ROUNDER",uncapped:true}] },
    { id: "RCB", name: "Royal Challengers Bengaluru", logo: "https://upload.wikimedia.org/wikipedia/en/2/2a/Royal_Challengers_Bangalore_2020_Logo.svg", pool: [{name:"Virat Kohli",role:"BATTER"},{name:"Rajat Patidar",role:"BATTER"},{name:"Yash Dayal",role:"BOWLER",uncapped:true},{name:"Mohammed Siraj",role:"BOWLER"},{name:"Will Jacks",role:"ALL-ROUNDER"},{name:"Cameron Green",role:"ALL-ROUNDER"}] },
    { id: "KKR", name: "Kolkata Knight Riders", logo: "https://upload.wikimedia.org/wikipedia/en/4/4c/Kolkata_Knight_Riders_Logo.svg", pool: [{name:"Rinku Singh",role:"BATTER"},{name:"Varun Chakaravarthy",role:"BOWLER"},{name:"Sunil Narine",role:"ALL-ROUNDER"},{name:"Andre Russell",role:"ALL-ROUNDER"},{name:"Harshit Rana",role:"BOWLER",uncapped:true},{name:"Ramandeep Singh",role:"ALL-ROUNDER",uncapped:true}] },
    { id: "RR", name: "Rajasthan Royals", logo: "https://upload.wikimedia.org/wikipedia/en/6/60/Rajasthan_Royals_Logo.svg", pool: [{name:"Sanju Samson",role:"WICKETKEEPER"},{name:"Yashasvi Jaiswal",role:"BATTER"},{name:"Riyan Parag",role:"ALL-ROUNDER"},{name:"Dhruv Jurel",role:"WICKETKEEPER"},{name:"Shimron Hetmyer",role:"BATTER"},{name:"Sandeep Sharma",role:"BOWLER",uncapped:true}] },
    { id: "DC", name: "Delhi Capitals", logo: "https://upload.wikimedia.org/wikipedia/en/2/2f/Delhi_Capitals_Logo.svg", pool: [{name:"Axar Patel",role:"ALL-ROUNDER"},{name:"Kuldeep Yadav",role:"BOWLER"},{name:"Tristan Stubbs",role:"WICKETKEEPER"},{name:"Abishek Porel",role:"WICKETKEEPER",uncapped:true},{name:"Rishabh Pant",role:"WICKETKEEPER"}] },
    { id: "SRH", name: "Sunrisers Hyderabad", logo: "https://upload.wikimedia.org/wikipedia/en/8/81/Sunrisers_Hyderabad_Logo.svg", pool: [{name:"Heinrich Klaasen",role:"WICKETKEEPER"},{name:"Pat Cummins",role:"ALL-ROUNDER"},{name:"Abhishek Sharma",role:"BATTER"},{name:"Travis Head",role:"BATTER"},{name:"Nitish Kumar Reddy",role:"ALL-ROUNDER"}] },
    { id: "LSG", name: "Lucknow Super Giants", logo: "https://upload.wikimedia.org/wikipedia/en/a/a9/Lucknow_Super_Giants_IPL_Logo.svg", pool: [{name:"Nicholas Pooran",role:"WICKETKEEPER"},{name:"Ravi Bishnoi",role:"BOWLER"},{name:"Mayank Yadav",role:"BOWLER"},{name:"Mohsin Khan",role:"BOWLER",uncapped:true},{name:"Ayush Badoni",role:"BATTER",uncapped:true}] },
    { id: "GT", name: "Gujarat Titans", logo: "https://upload.wikimedia.org/wikipedia/en/0/09/Gujarat_Titans_Logo.svg", pool: [{name:"Rashid Khan",role:"BOWLER"},{name:"Shubman Gill",role:"BATTER"},{name:"Sai Sudharsan",role:"BATTER"},{name:"Rahul Tewatia",role:"ALL-ROUNDER",uncapped:true},{name:"Shahrukh Khan",role:"BATTER",uncapped:true}] },
    { id: "PBKS", name: "Punjab Kings", logo: "https://upload.wikimedia.org/wikipedia/en/d/d4/Punjab_Kings_Logo.svg", pool: [{name:"Shashank Singh",role:"BATTER",uncapped:true},{name:"Prabhsimran Singh",role:"WICKETKEEPER",uncapped:true},{name:"Arshdeep Singh",role:"BOWLER"},{name:"Jitesh Sharma",role:"WICKETKEEPER"}] }
  ];

  const RETENTION_SLABS = [1800, 1400, 1100, 1800, 1400]; // In Lakhs
  const UNCAPPED_PRICE = 400; // 4 Cr

  let selectedTeamId = null;
  let retainedPlayers = [];

  function renderApp() {
    const app = document.getElementById('app');

    if (!selectedTeamId) {
      // STEP 1: SELECT FRANCHISE SCREEN
      app.innerHTML = `
        <div class="section-title-wrap">
          <h1 class="page-title">SELECT YOUR <span>FRANCHISE</span></h1>
          <p class="page-subtitle">Choose your team to manage retentions and lead in the 2026 Mega Auction</p>
        </div>

        <div class="team-select-grid">
          ${TEAMS.map(t => `
            <div class="team-select-card" onclick="selectFranchise('${t.id}')">
              <div class="team-logo-circle"><img src="${t.logo}" alt="${t.id}"></div>
              <div class="team-code">${t.id}</div>
              <div class="team-full-name">${t.name}</div>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      // STEP 2: BUILD YOUR CORE SQUAD (RETENTION DASHBOARD)
      const team = TEAMS.find(t => t.id === selectedTeamId);
      
      let cappedCount = 0;
      let uncappedCount = 0;
      let spentLakhs = 0;

      let cappedIdx = 0;
      retainedPlayers.forEach(pName => {
        const pObj = team.pool.find(p => p.name === pName);
        if (pObj) {
          if (pObj.uncapped) {
            uncappedCount++;
            spentLakhs += UNCAPPED_PRICE;
          } else {
            cappedCount++;
            spentLakhs += RETENTION_SLABS[Math.min(cappedIdx, 4)];
            cappedIdx++;
          }
        }
      });

      const totalSlots = retainedPlayers.length;
      const rtmCards = 6 - totalSlots;
      const totalPurseCr = 120.0;
      const spentCr = (spentLakhs / 100).toFixed(1);
      const remainingCr = (totalPurseCr - parseFloat(spentCr)).toFixed(1);

      app.innerHTML = `
        <div class="retention-top-bar">
          <div>
            <h1 class="retention-headline">Build Your <span>CORE SQUAD</span></h1>
            <p class="page-subtitle" style="margin-top:6px;">Select up to 6 players to retain from your 2025 roster.</p>
          </div>
          <div class="purse-box">
            <div class="purse-label">REMAINING PURSE</div>
            <div class="purse-value">₹${remainingCr} <span style="font-size:18px;">Cr</span></div>
            <div class="purse-total">TOTAL: ${totalPurseCr} CR</div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-header">TOTAL SLOTS</div>
            <div class="stat-num">${totalSlots} <span style="font-size:20px;color:var(--text-muted);">/ 6</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-header">✓ CAPPED</div>
            <div class="stat-num">${cappedCount} <span style="font-size:20px;color:var(--text-muted);">/ 5</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-header">☆ UNCAPPED</div>
            <div class="stat-num">${uncappedCount} <span style="font-size:20px;color:var(--text-muted);">/ 2</span></div>
          </div>
          <div class="stat-card rtm-card">
            <div class="stat-header">RTM STRATEGY</div>
            <div class="stat-num">${rtmCards} CARDS</div>
            <div class="rtm-subtitle">Available for the Auction</div>
          </div>
        </div>

        <div class="slab-notice">
          <span style="font-size:18px;">ⓘ</span>
          <div><b>SLAB SYSTEM:</b> Capped players follow descending purse deductions (18, 14, 11, 18, 14 Cr). Uncapped players are fixed at 4 Cr.</div>
        </div>

        <div class="players-grid">
          ${team.pool.map(p => {
            const isSelected = retainedPlayers.includes(p.name);
            return `
              <div class="player-card ${isSelected ? 'selected' : ''}" onclick="togglePlayer('${p.name}')">
                <div class="player-avatar">
                  <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(p.name)}" alt="${p.name}">
                </div>
                <div class="type-badge">${p.uncapped ? 'UNCAPPED' : 'CAPPED'}</div>
                <div class="p-name">${p.name}</div>
                <div class="p-role">${p.role}</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="bottom-sticky-bar">
          <div class="spent-info">SPENT: <span>₹${spentCr} Cr</span></div>
          <div class="remaining-info">REMAINING: <span>₹${remainingCr} Cr</span></div>
          <button class="btn-finalize" onclick="finalizeCore()">FINALIZE CORE</button>
          <button class="btn-skip" onclick="skipRetentions()">SKIP ALL RETENTIONS</button>
        </div>
      `;
    }
  }

  function selectFranchise(teamId) {
    selectedTeamId = teamId;
    retainedPlayers = [];
    renderApp();
  }

  function togglePlayer(playerName) {
    const team = TEAMS.find(t => t.id === selectedTeamId);
    const pObj = team.pool.find(p => p.name === playerName);
    const exists = retainedPlayers.includes(playerName);

    if (!exists) {
      if (retainedPlayers.length >= 6) {
        alert("Maximum 6 players can be retained!");
        return;
      }
      retainedPlayers.push(playerName);
    } else {
      retainedPlayers = retainedPlayers.filter(name => name !== playerName);
    }

    renderApp();
  }

  function finalizeCore() {
    alert(`Core Squad Finalized for ${selectedTeamId}! Entering Auction Arena...`);
  }

  function skipRetentions() {
    retainedPlayers = [];
    renderApp();
  }

  renderApp();
</script>
</body>
</html>
