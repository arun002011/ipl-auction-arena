<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPL Auction Simulator 2026 - MockAuction.in Style</title>
  <style>
    :root{--navy:#080e1e;--navy2:#111a2e;--orange:#ff6b24;--gold:#ffd166;--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#16a34a;--red:#dc2626}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif}
    
    header{background:linear-gradient(135deg,var(--navy),#1e293b);color:#fff;padding:16px max(20px,calc((100% - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--orange);box-shadow:0 4px 15px #00000025}
    .brand{font-weight:900;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
    .brand span{color:var(--orange)}
    .brand-tag{background:var(--orange);color:#fff;font-size:10px;padding:2px 8px;border-radius:12px;font-weight:800;letter-spacing:1px}
    .headmeta{font-size:13px;color:#cbd5ee;background:#ffffff15;padding:5px 14px;border-radius:20px;backdrop-filter:blur(5px)}
    
    main{max-width:1280px;margin:22px auto;padding:0 16px}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 25px -5px #0f172a0d}
    .full{grid-column:1/-1}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
    .title{font-size:24px;margin:0 0 8px;font-weight:800;color:var(--navy)}
    .muted{color:var(--muted)}
    
    .field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;margin:5px 0 12px;color:var(--text)}
    .btn{border:0;border-radius:10px;background:var(--orange);color:white;font-weight:800;padding:12px 18px;font:inherit;cursor:pointer;box-shadow:0 4px 12px #ff6b2430;transition:all .15s ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px #ff6b2445}
    .btn.secondary{background:#f1f5f9;color:var(--text);box-shadow:none}
    .btn.dark{background:var(--navy2);color:#fff}
    .btn.danger{background:var(--red)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    
    /* MockAuction Feature Badges */
    .featuregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
    .featurebox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
    .featurebox b{font-size:22px;display:block;color:var(--navy);font-weight:900}
    .featurebox span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
    
    /* Team & Retention Cards */
    .teamgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .teamcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;box-shadow:0 4px 15px #00000008;transition:all .2s ease}
    .teamcard.selected{border-color:var(--orange);background:#fffcf9;box-shadow:0 8px 25px #ff6b241a}
    .teamcard-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:12px}
    .teamcard-title{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
    .teamdot{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--line)}
    
    .purse-tracker{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:8px 12px;border-radius:10px;margin-bottom:10px;border:1px solid var(--line)}
    .purse-tracker b{color:var(--navy);font-size:14px}
    
    .retain-list{display:flex;flex-direction:column;gap:7px;max-height:220px;overflow-y:auto;padding-right:4px}
    .retainitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-size:13px;transition:all .15s ease}
    .retainitem:hover{border-color:#cbd5e1;background:#f1f5f9}
    .retainitem.checked{background:#f0fdf4;border-color:#86efac}
    .retainitem input[type="checkbox"]{width:16px;height:16px;accent-color:var(--orange);cursor:pointer}

    /* Player Auction Card */
    .playerhero{background:linear-gradient(140deg,var(--navy),#1e3a8a);color:#fff;border-radius:16px;padding:24px;position:relative;overflow:hidden;box-shadow:0 12px 30px #080e1e35}
    .playerhero::after{content:'IPL 2026';position:absolute;right:-10px;bottom:-30px;font-size:100px;font-weight:1000;color:#ffffff08;pointer-events:none}
    .playername{font-size:clamp(26px,3.5vw,36px);font-weight:900;margin:6px 0}
    .bidamount{font-size:clamp(34px,5vw,48px);font-weight:1000;color:var(--gold);margin:10px 0}
    
    /* Controls & RTM Panel */
    .rtm-panel{background:#fffbeb;border:2px solid var(--gold);padding:14px;border-radius:12px;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
    .tablewrap{overflow:auto;max-height:380px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0}
    
    .log{max-height:190px;overflow:auto;font-size:13px}
    .log div{padding:6px 0;border-bottom:1px dashed var(--line)}
    .notice{font-size:13px;padding:12px;border-radius:10px;background:#fef3c7;color:#78350f;margin-top:12px;border:1px solid #fde68a}
    .badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:800;background:#e2e8f0;color:var(--navy)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .strength-bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:4px}
    .strength-fill{height:100%;background:var(--green);width:0%}
    .roomcode{font-size:32px;font-weight:1000;letter-spacing:4px;color:var(--orange)}
    .squad-inspector{margin-top:15px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
    
    @media(max-width:850px){.layout{grid-template-columns:1fr}.teamgrid{grid-template-columns:1fr}.featuregrid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>

  function generateCode() { return Math.random().toString(36).substring(2, 7).toUpperCase(); }

  async function createRoom(mode) {
    const userName = document.getElementById('displayNameInput').value.trim() || "Host";
    const code = generateCode();
    const initialTeams = {};

    TEAMS.forEach(t => {
      let defaultRetain = t.pool.slice(0, 3).map((p, idx) => ({ ...p, cost: p.uncapped ? 400 : RETENTION_SLABS[idx] }));
      let spent = defaultRetain.reduce((acc, p) => acc + p.cost, 0);
      
      initialTeams[t.id] = { 
        claimedBy: null, 
        userName: "AI Franchise", 
        purse: 12000 - spent, 
        rtmCards: 6 - defaultRetain.length,
        players: defaultRetain.map(r => ({ name: r.name, cost: r.cost, country: r.country, role: r.role, type: "Retention" })), 
        retainedList: defaultRetain 
      };
    });

    const roomData = {
      code: code,
      hostId: currentUser.uid,
      hostName: userName,
      mode: mode,
      status: "RETENTION",
      teams: initialTeams,
      currentPlayerIndex: 0,
      currentBid: PLAYERS[0].base,
      currentBidder: null,
      logs: [`Room created in ${mode} mode. Phase 1: Retentions & RTM Setup.`]
    };

    await db.collection("rooms").doc(code).set(roomData);
    listenToRoom(code);
  }

  async function joinRoom() {
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!code) return alert("Enter Room Code");
    const snap = await db.collection("rooms").doc(code).get();
    if (snap.exists) listenToRoom(code);
    else alert("Room not found");
  }

  function listenToRoom(code) {
    currentRoomId = code;
    if (unsubscribeRoom) unsubscribeRoom();
    unsubscribeRoom = db.collection("rooms").doc(code).onSnapshot(doc => {
      if (doc.exists) {
        const roomData = doc.data();
        renderRoom(roomData);
        if (roomData.status === "AUCTION" && roomData.hostId === currentUser.uid) {
          triggerAILogic(roomData);
        }
      }
    });
  }

  async function claimTeam(teamId) {
    const name = document.getElementById('displayNameInput')?.value || "User";
    const ref = db.collection("rooms").doc(currentRoomId);
    await ref.update({
      [`teams.${teamId}.claimedBy`]: currentUser.uid,
      [`teams.${teamId}.userName`]: name,
      logs: firebase.firestore.FieldValue.arrayUnion(`${name} claimed ${teamId}`)
    });
  }

    const snap = await db.collection("rooms").doc(currentRoomId).get();
    const team = snap.data().teams[teamId];
    
    let currentRetain = team.retainedList || [];
    let exists = currentRetain.some(p => p.name === playerObj.name);

    if (!exists && currentRetain.length >= 6) {
      alert("IPL Rule Limit: Maximum 6 retentions allowed!");
      return;
    }

    let updatedRetain = exists ? currentRetain.filter(p => p.name !== playerObj.name) : [...currentRetain, playerObj];
    
    let spent = 0;
    updatedRetain = updatedRetain.map((p, idx) => {
      let cost = p.uncapped ? 400 : RETENTION_SLABS[Math.min(idx, 5)];
      spent += cost;
      return { ...p, cost: cost };
    });

    let newPurse = 12000 - spent;
    let rtmCards = 6 - updatedRetain.length;

    await db.collection("rooms").doc(currentRoomId).update({
      [`teams.${teamId}.retainedList`]: updatedRetain,
      [`teams.${teamId}.players`]: updatedRetain.map(r => ({ name: r.name, cost: r.cost, country: r.country, role: r.role, type: "Retention" })),
      [`teams.${teamId}.purse`]: newPurse,
      [`teams.${teamId}.rtmCards`]: rtmCards
    });
  }

  async function startMainAuction() {
    const ref = db.collection("rooms").doc(currentRoomId);
    await ref.update({
      status: "AUCTION",
      logs: firebase.firestore.FieldValue.arrayUnion("Retention Phase locked! Main Auction Started.")
    });
  }

  async function placeBid(overrideTeam = null) {
    const snap = await db.collection("rooms").doc(currentRoomId).get();
    const data = snap.data();

    let targetTeam = overrideTeam;
    if (!targetTeam) {
      for (const [tid, t] of Object.entries(data.teams)) {
        if (t.claimedBy === currentUser.uid) targetTeam = tid;
      }
    }

    if (!targetTeam) return alert("Claim a team first!");

    let teamData = data.teams[targetTeam];
    if (teamData.players.length >= 25) return;

    let increment = data.currentBid < 1000 ? 20 : 50;
    let nextBid = data.currentBidder ? data.currentBid + increment : data.currentBid;

    if (teamData.purse < nextBid) return;

    await db.collection("rooms").doc(currentRoomId).update({
      currentBid: nextBid,
      currentBidder: targetTeam,
      logs: firebase.firestore.FieldValue.arrayUnion(`${targetTeam} bid ₹${nextBid} Lakhs`)
    });
  }

  function triggerAILogic(data) {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(async () => {
      const p = PLAYERS[data.currentPlayerIndex];
      if (!p) return;

      const increment = data.currentBid < 1000 ? 20 : 50;
      const nextBid = data.currentBidder ? data.currentBid + increment : data.currentBid;

      let eligibleAIs = [];
      Object.entries(data.teams).forEach(([tid, t]) => {
        if (!t.claimedBy && tid !== data.currentBidder) {
          const squad = t.players || [];
          const overseasCount = squad.filter(sp => sp.country === "Overseas").length;

          if (squad.length < 25 && t.purse >= nextBid) {
            if (p.country !== "Overseas" || overseasCount < 8) {
              let maxValuation = Math.max(p.base * 3, 600);
              if (nextBid <= maxValuation) {
                eligibleAIs.push(tid);
              }
            }
          }
        }
      });

      if (eligibleAIs.length > 0) {
        let chosenAI = eligibleAIs[Math.floor(Math.random() * eligibleAIs.length)];
        await placeBid(chosenAI);
      }
    }, 2000);
  }

  async function adminSellPlayer() {
    const ref = db.collection("rooms").doc(currentRoomId);
    const snap = await ref.get();
    const data = snap.data();
    const p = PLAYERS[data.currentPlayerIndex];

    if (!data.currentBidder) return alert("No bids placed!");

    let winningTeam = data.currentBidder;
    let finalCost = data.currentBid;
    let nextIdx = data.currentPlayerIndex + 1;
    let nextPlayer = PLAYERS[nextIdx] || PLAYERS[0];

    let updatedPlayers = [...data.teams[winningTeam].players, { name: p.name, cost: finalCost, country: p.country, role: p.role, type: "Auction" }];
    let updatedPurse = data.teams[winningTeam].purse - finalCost;

    await ref.update({
      [`teams.${winningTeam}.players`]: updatedPlayers,
      [`teams.${winningTeam}.purse`]: updatedPurse,
      currentPlayerIndex: nextIdx,
      currentBid: nextPlayer.base,
      currentBidder: null,
      logs: firebase.firestore.FieldValue.arrayUnion(`SOLD! ${p.name} to ${winningTeam} for ₹${finalCost} Lakhs.`)
    });
  }

  async function adminSkipPlayer() {
    const ref = db.collection("rooms").doc(currentRoomId);
    const snap = await ref.get();
    const data = snap.data();

    let nextIdx = data.currentPlayerIndex + 1;
    let nextPlayer = PLAYERS[nextIdx] || PLAYERS[0];

    await ref.update({
      currentPlayerIndex: nextIdx,
      currentBid: nextPlayer.base,
      currentBidder: null,
      logs: firebase.firestore.FieldValue.arrayUnion(`SKIPPED/UNSOLD! ${PLAYERS[data.currentPlayerIndex].name}`)
    });
  }

  function calculateTeamStrength(players) {
    if (!players || players.length === 0) return 10;
    let roles = { BAT: 0, BOWL: 0, AR: 0, WK: 0 };
    players.forEach(p => { if (roles[p.role] !== undefined) roles[p.role]++; });

    let balanceScore = Math.min(roles.BAT, 4) * 10 + Math.min(roles.BOWL, 4) * 10 + Math.min(roles.AR, 2) * 15 + Math.min(roles.WK, 1) * 20;
    let sizeScore = Math.min(players.length / 18, 1) * 30;

    return Math.min(Math.round(balanceScore * 0.7 + sizeScore), 100);
  }

  function renderRoom(data) {
    const app = document.getElementById('app');
    const isAdmin = data.hostId === currentUser.uid;

    let myTeam = null;
    for (const [tid, t] of Object.entries(data.teams)) {
      if (t.claimedBy === currentUser.uid) myTeam = tid;
    }

    const userRole = isAdmin ? "ADMIN / HOST" : myTeam ? `OWNER (${myTeam})` : "SPECTATOR";
    document.getElementById('headerStatus').innerText = `Room: ${data.code} | Role: ${userRole}`;

    if (data.status === "RETENTION") {
      app.innerHTML = `
        <div class="layout">
          <section class="card">
            <div class="eyebrow">PHASE 1: RETENTIONS & RTM CARDS</div>
            <h2 class="title">Official Franchises Retentions</h2>
            <p class="muted">Check or uncheck player retentions (Max 6). Remaining slots turn into RTM cards!</p>
            
            <div class="teamgrid">
              ${TEAMS.map(t => {
                const td = data.teams[t.id];
                const isMine = td.claimedBy === currentUser.uid;
                const retainCount = (td.retainedList || []).length;
                return `
                  <div class="teamcard ${isMine ? 'selected' : ''}">
                    <div class="teamcard-header">
                      <span class="teamcard-title"><span class="teamdot" style="background:${t.color}"></span>${t.name}</span>${!td.claimedBy ? `<button class="btn secondary" style="padding:4px 8px;font-size:11px;" onclick="claimTeam('${t.id}')">Claim Team</button>` : `<small>${isMine ? '<b>Your Team</b>' : td.userName}</small>`}
                    </div>

                    <div class="purse-tracker">
                      <span>Purse Left: <b>₹${(td.purse / 100).toFixed(2)} Cr</b></span>
                      <span>Retained: <b>${retainCount}/6</b> \vert{} RTMs: <b>${td.rtmCards || 0}</b></span>
                    </div>

                    <div class="retain-list">
                      ${t.pool.map(p => {
                        const isRetained = (td.retainedList || []).some(r => r.name === p.name);
                        return `
                          <div class="retainitem ${isRetained ? 'checked' : ''}">
                            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;">
                              <input type="checkbox" ${isRetained ? 'checked' : ''} ${!isMine ? 'disabled' : ''} onclick="toggleRetention('${t.id}', ${JSON.stringify(p).replace(/"/g, '&quot;')})">
                              <span style="flex:1;"><b>${p.name}</b> ${p.uncapped ? '<span class="badge">Uncapped</span>' : ''}</span>
                              <span class="muted" style="font-size:11px;">${p.role}</span>
                            </label>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <section class="card">
            <div class="eyebrow">ROOM CONTROLS</div>
            <h3>Room Code: <span class="roomcode">${data.code}</span></h3>
            ${isAdmin ? `<button class="btn" onclick="startMainAuction()">Lock Retentions & Start Auction →</button>` : `<p class="muted">Waiting for Host to lock retentions...</p>`}
            
            <div class="sectiontitle" style="margin-top:20px;">Activity Log</div>
            <div class="log">${(data.logs||[]).slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div>
          </section>
        </div>
      `;
    } else if (data.status === "AUCTION") {
      const p = PLAYERS[data.currentPlayerIndex];
      const selectedInspectorTeam = document.getElementById('inspectorSelect')?.value || (myTeam || "CSK");
      const inspectorSquad = data.teams[selectedInspectorTeam]?.players || [];

      app.innerHTML = `
        <div class="layout">
          <section class="card">
            <div class="playerhero">
              <span class="badge">${p.set} SET</span>
              <div class="playername">${p.name}</div>
              <div class="muted" style="color:#cbd5ee">${p.role} · ${p.country} · Base Price: ₹${p.base} L</div>
              <div class="bidamount">₹${data.currentBid} Lakhs</div>
              <div><b>Highest Bidder:</b> ${data.currentBidder ? (data.teams[data.currentBidder].claimedBy ? data.currentBidder + " (User)" : data.currentBidder + " (AI)") : 'No Bids Yet'}</div>
            </div>

            <div class="actions">
              ${myTeam ? `<button class="btn" onclick="placeBid()">Bid ₹${data.currentBidder ? (data.currentBid < 1000 ? data.currentBid + 20 : data.currentBid + 50) : data.currentBid} L</button>` : `<button class="btn secondary" disabled>Spectating Only</button>`}
              ${isAdmin ? `
                <button class="btn dark" onclick="adminSellPlayer()">Sell Player</button>
                <button class="btn danger" onclick="adminSkipPlayer()">Skip / Unsold</button>
              ` : ''}
            </div>

            <div class="squad-inspector">
              <div class="eyebrow">${isAdmin ? 'ADMIN SQUAD INSPECTOR' : 'SQUAD INSPECTOR'}</div>
              <select id="inspectorSelect" class="field" style="margin-bottom:8px;" onchange="renderRoom(lastRoomData)">
                ${TEAMS.map(t => `<option value="${t.id}" ${t.id === selectedInspectorTeam ? 'selected' : ''}>${t.name} (${data.teams[t.id].players.length} Players)</option>`).join('')}
              </select>

              <div class="tablewrap" style="max-height:180px;">
                <table>
                  <thead><tr><th>Player</th><th>Role</th><th>Country</th><th>Price</th><th>Type</th></tr></thead>
                  <tbody>
                    ${inspectorSquad.length > 0 ? inspectorSquad.map(sp => `
                      <tr>
                        <td><b>${sp.name}</b></td>
                        <td>${sp.role}</td>
                        <td>${sp.country}</td>
                        <td>₹${sp.cost} L</td>
                        <td><span class="badge">${sp.type}</span></td>
                      </tr>
                    `).join('') : '<tr><td colspan="5" class="muted">No players in squad yet.</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="eyebrow">LIVE STANDINGS & OVERSEAS TRACKER</div>
            <div class="tablewrap">
              <table>
                <thead>
                  <tr>
                    <th>Team</th>
                    <th>Type</th>
                    <th>Purse Left</th>
                    <th>Squad</th>
                    <th>Overseas</th>
                    <th>Strength</th>
                  </tr>
                </thead>
                <tbody>
                  ${TEAMS.map(t => {
                    const teamObj = data.teams[t.id];
                    const squad = teamObj.players || [];
                    const overseasCount = squad.filter(sp => sp.country === "Overseas").length;
                    const strength = calculateTeamStrength(squad);
                    return `
                      <tr>
                        <td><b>${t.id}</b></td>
                        <td><small>${teamObj.claimedBy ? 'User' : 'AI'}</small></td>
                        <td>₹${(teamObj.purse / 100).toFixed(2)} Cr</td>
                        <td>${squad.length}/25</td>
                        <td><span style="color:${overseasCount >= 8 ? 'var(--red)' : 'var(--text)'}">${overseasCount}/8</span></td>
                        <td>
                          <b>${strength}%</b>
                          <div class="strength-bar"><div class="strength-fill" style="width:${strength}%"></div></div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>

            <div class="sectiontitle" style="margin-top:15px;">Live Feed</div>
            <div class="log">${(data.logs||[]).slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div>
          </section>
        </div>
      `;
    }
  }
  let lastRoomData = null;
  const originalRenderRoom = renderRoom;
  renderRoom = function(d) { lastRoomData = d; originalRenderRoom(d); };
</script>
</body>
</html>
