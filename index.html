function createInitialTeam(i){return {id:TEAMS[i].id,ownerUid:null,ownerName:'AI',purse:12000,squad:[],retentionChoices:[],retentionConfirmed:false,rtm:6}}
function createInitialTeam(i){TEAMS.forEach((t, i) => batch.set(ref.collection('teams').doc(t.id), createInitialTeam(i)));}
function shuffledQueue(retainedNames=[]){const retained=new Set(retainedNames.map(n=>String(n).toLowerCase()));return PLAYERS.map((p,i)=>({...p,id:'p'+i})).filter(p=>!retained.has(p.name.toLowerCase())).sort((a,b)=>{const order=['M1','M2','BA','AL','WK','FA','SP','UN','HIST'];return order.indexOf(a.set)-order.indexOf(b.set)}).map(p=>p.id)}
async function createRoom(){try{const n=nameInput(),code=Math.random().toString(36).slice(2,7).toUpperCase(),ref=db.collection('rooms').doc(code),batch=db.batch();const q=shuffledQueue();batch.set(ref,{code,hostUid:user.uid,hostName:n,phase:'lobby',createdAt:firebase.firestore.FieldValue.serverTimestamp(),playerQueue:q,playerIndex:-1,currentPlayer:null,currentBid:0,leaderTeam:null,deadline:0,bidState:'idle',sold:[],unsold:[],log:[`${n} created the room.`],version:1});TEAMS.forEach((t,i)=>batch.set(ref.collection('teams').doc(t.id),createInitialTeam(i)));await batch.commit();await enterRoom(code,n); }catch(e){document.getElementById('homeMsg').textContent='Could not create room: '+e.message}}
async function joinRoom(){const code=(document.getElementById('joinCode').value||'').trim().toUpperCase();if(!code)return;try{const snap=await db.collection('rooms').doc(code).get();if(!snap.exists){document.getElementById('homeMsg').textContent='Room not found. Check the code.';return}await enterRoom(code,nameInput())}catch(e){document.getElementById('homeMsg').textContent=e.message}}
async function enterRoom(code,name){roomCode=code;localStorage.setItem('iplName',name);const ref=db.collection('rooms').doc(code);unsubRoom=ref.onSnapshot(s=>{if(!s.exists){home();return}room=s.data();isHost=room.hostUid===user.uid;document.getElementById('headerStatus').textContent=`Room ${code} · ${room.phase.toUpperCase()}${isHost?' · HOST':''}`;renderRoom()});unsubTeams=ref.collection('teams').onSnapshot(s=>{teamsState={};myTeam=null;s.forEach(d=>{teamsState[d.id]=d.data();if(d.data().ownerUid===user.uid)myTeam=d.id});renderRoom()});if(tick)clearInterval(tick);tick=setInterval(hostTick,800)}
function clearRoomListeners(){if(unsubRoom)unsubRoom();if(unsubTeams)unsubTeams();unsubRoom=unsubTeams=null;if(tick)clearInterval(tick);tick=null;roomCode=null;room=null;teamsState={};myTeam=null;isHost=false}
async function claimTeam(id){if(!room||room.phase!=='lobby')return;try{const ref=db.collection('rooms').doc(roomCode),teamRef=ref.collection('teams').doc(id);await db.runTransaction(async tx=>{const r=(await tx.get(ref)).data(),t=(await tx.get(teamRef)).data();if(r.phase!=='lobby')throw Error('The auction has already started.');if(t.ownerUid&&t.ownerUid!==user.uid)throw Error('This team has already been claimed.');const all=await tx.get(ref.collection('teams'));let already=false;all.forEach(d=>{if(d.data().ownerUid===user.uid&&d.id!==id)already=true});if(already)throw Error('You already own a team. Leave that team first.');tx.update(teamRef,{ownerUid:user.uid,ownerName:nameInput()});tx.update(ref,{log:firebase.firestore.FieldValue.arrayUnion(`${nameInput()} selected ${teamById(id).name}.`)})})}catch(e){alert(e.message)}}
async function becomeSpectator(){if(myTeam){try{await db.collection('rooms').doc(roomCode).collection('teams').doc(myTeam).update({ownerUid:null,ownerName:'AI'}); }catch(e){}}myTeam=null;renderRoom()}
async function startAuction(){if(!isHost||room.phase!=='lobby')return;try{await db.collection('rooms').doc(roomCode).update({phase:'retention',bidState:'retention',log:firebase.firestore.FieldValue.arrayUnion('Retention window opened. Each franchise may retain up to six players.')})}catch(e){alert(e.message)}}
async function saveRetentionChoices(){if(!room||room.phase!=='retention'||!myTeam)return alert('Choose a franchise first.');const selected=[...document.querySelectorAll('input[name=retpick]:checked')].map(x=>Number(x.value));if(selected.length>6)return alert('You can select up to 6 players.');const candidates=RETENTIONS[TEAMS.findIndex(t=>t.id===myTeam)]||[];const choices=selected.map(i=>candidates[i]);const capped=choices.filter(p=>!isUncappedRetention(p)).length,uncapped=choices.length-capped;if(capped>5||uncapped>2)return alert('Retention limit: maximum 5 capped and 2 uncapped players.');try{await db.collection('rooms').doc(roomCode).collection('teams').doc(myTeam).update({retentionChoices:choices,retentionConfirmed:true});alert('Retention choices saved. The host can start the auction when ready.')}catch(e){alert(e.message)}}
function isUncappedRetention(p){return ['Shashank Singh','Prabhsimran Singh','Harshit Rana','Ramandeep Singh','Abishek Porel','Nitish Kumar Reddy','Sandeep Sharma'].includes(p.name)}
async function launchMainAuction(){if(!isHost||room.phase!=='retention')return;try{const ref=db.collection('rooms').doc(roomCode),snaps=await ref.collection('teams').get(),batch=db.batch();let retainedNames=[];snaps.forEach((doc,i)=>{const t=doc.data(),choices=(t.ownerUid?(t.retentionChoices||[]):(RETENTIONS[i]||[])).slice(0,6),capped=choices.filter(p=>!isUncappedRetention(p)),uncapped=choices.filter(isUncappedRetention),sorted=[...capped,...uncapped],prices=[1800,1400,1100,1800,1400];let used=0,squad=sorted.map((p,i)=>{const cost=isUncappedRetention(p)?400:(prices[used++]||1400);retainedNames.push(p.name.toLowerCase());return {...p,price:cost,retained:true}});const spent=squad.reduce((a,p)=>a+p.price,0);batch.update(doc.ref,{squad,purse:12000-spent,rtm:6-squad.length,retentionConfirmed:true})});await batch.commit();const queue=shuffledQueue(retainedNames);const p=playerById(queue[0]);await ref.update({phase:'auction',playerQueue:queue,playerIndex:0,currentPlayer:p,currentBid:0,leaderTeam:null,deadline:Date.now()+12000,bidState:'live',rtmTeam:null,rtmOutcome:null,log:firebase.firestore.FieldValue.arrayUnion('Retention window closed. Main auction started! First player: '+(p?.name||'Unknown'))})}catch(e){alert('Could not start auction: '+e.message)}}
function playerById(id){const m=String(id).match(/^p(\d+)$/);return m?({...PLAYERS[+m[1]],id}):null}
async function placeBid(){if(!room||room.phase!=='auction'||!myTeam)return;const p=room.currentPlayer;if(!p)return;const amount=nextBid(),team=teamsState[myTeam];if(!team)return;try{await db.runTransaction(async tx=>{const rr=db.collection('rooms').doc(roomCode),tr=rr.collection('teams').doc(myTeam),rs=await tx.get(rr),ts=await tx.get(tr);const r=rs.data(),t=ts.data();if(r.phase!=='auction'||r.bidState!=='live'||r.deadline<Date.now())throw Error('Bidding time has ended.');const bid=r.currentBid?r.currentBid+inc(r.currentBid):r.currentPlayer.base;if(r.leaderTeam===myTeam)throw Error('Your team is already the highest bidder.');if(amount!==bid)throw Error('The bid changed. Please try again.');if(t.purse<bid)throw Error('Not enough purse for this bid.');if(t.squad.length>=25)throw Error('Your squad has reached 25 players.');if(!isIndian(p.country)&&overseasCount(t)>=8)throw Error('Maximum 8 overseas players allowed.');tx.update(rr,{currentBid:bid,leaderTeam:myTeam,deadline:Date.now()+10000,log:firebase.firestore.FieldValue.arrayUnion(`${teamById(myTeam).id} bids ${money(bid)} for ${p.name}.`)})})}catch(e){alert(e.message)}}
async function hostTick(){if(!isHost||!room||room.phase!=='auction'||processing||!room.deadline)return;if(Date.now()<room.deadline){await maybeAIBid();return}processing=true;try{await settleCurrent()}catch(e){console.error(e)}finally{processing=false}}
async function maybeAIBid(){if(!room||room.phase!=='auction'||room.bidState!=='live'||Date.now()-lastAiAt<1800||Math.random()>.22)return;const ref=db.collection('rooms').doc(roomCode);lastAiAt=Date.now();try{await db.runTransaction(async tx=>{const rs=await tx.get(ref);if(!rs.exists)return;const r=rs.data();if(r.phase!=='auction'||r.bidState!=='live'||r.deadline<Date.now()||!r.currentPlayer)return;const snaps=await Promise.all(TEAMS.map(team=>tx.get(ref.collection('teams').doc(team.id))));const bid=r.currentBid?r.currentBid+inc(r.currentBid):r.currentPlayer.base;let candidates=[];snaps.forEach(doc=>{const t=doc.data();if(!t||t.ownerUid||doc.id===r.leaderTeam||t.purse<bid||t.squad.length>=25||(!isIndian(r.currentPlayer.country)&&overseasCount(t)>=8))return;const cap=Math.max(r.currentPlayer.base*1.8,r.currentPlayer.base+50);if(bid<=cap&&Math.random()<.55)candidates.push({id:doc.id,t})});if(!candidates.length)return;const pick=candidates[Math.floor(Math.random()*candidates.length)];tx.update(ref,{currentBid:bid,leaderTeam:pick.id,deadline:Date.now()+10000,log:firebase.firestore.FieldValue.arrayUnion(`${pick.id} (AI) bids ${money(bid)} for ${r.currentPlayer.name}.`)})})}catch(e){console.warn('AI bid skipped',e.message)}}
async function settleCurrent(){const ref=db.collection('rooms').doc(roomCode);await db.runTransaction(async tx=>{const rs=await tx.get(ref);if(!rs.exists)return;const r=rs.data();if(r.phase!=='auction'||Date.now()<r.deadline||!r.currentPlayer)return;const p=r.currentPlayer,log=[...(r.log||[])];let sold=[...(r.sold||[])],unsold=[...(r.unsold||[])];
// RTM windows resolve before the player is settled.
if(r.bidState==='rtm_offer'){const leader=r.leaderTeam;const nextIndex=r.playerIndex+1,queue=r.playerQueue||[];log.push(`${p.name}: RTM offer expired; ${leader||'no team'} keeps the player.`);if(leader){const tr=ref.collection('teams').doc(leader),ts=await tx.get(tr);if(ts.exists){const t=ts.data();if(t.purse>=r.currentBid&&t.squad.length<25){tx.update(tr,{purse:t.purse-r.currentBid,squad:[...t.squad,{...p,price:r.currentBid,retained:false}]});sold.push({player:p,teamId:leader,price:r.currentBid});log.push(`SOLD! ${p.name} to ${leader} for ${money(r.currentBid)}.`)}else unsold.push(p.id)}}else unsold.push(p.id);return advanceAuctionTx(tx,ref,r,p,sold,unsold,log)}
if(r.bidState==='rtm_raise'){const winner=r.rtmTeam;const nextIndex=r.playerIndex+1,queue=r.playerQueue||[];if(winner){const tr=ref.collection('teams').doc(winner),ts=await tx.get(tr);if(ts.exists){const t=ts.data();if(t.purse>=r.currentBid&&t.squad.length<25){tx.update(tr,{purse:t.purse-r.currentBid,rtm:Math.max(0,(t.rtm||0)-1),squad:[...t.squad,{...p,price:r.currentBid,retained:false}]});sold.push({player:p,teamId:winner,price:r.currentBid});log.push(`RTM MATCHED! ${p.name} to ${winner} for ${money(r.currentBid)}.`)}else unsold.push(p.id)}}return advanceAuctionTx(tx,ref,r,p,sold,unsold,log)}
if(r.bidState==='rtm_final'){const winner=r.rtmOutcome==='rtm'?r.rtmTeam:r.leaderTeam;if(winner){const tr=ref.collection('teams').doc(winner),ts=await tx.get(tr);if(ts.exists){const t=ts.data();if(t.purse>=r.currentBid&&t.squad.length<25){tx.update(tr,{purse:t.purse-r.currentBid,rtm:r.rtmOutcome==='rtm'?Math.max(0,(t.rtm||0)-1):(t.rtm||0),squad:[...t.squad,{...p,price:r.currentBid,retained:false}]});sold.push({player:p,teamId:winner,price:r.currentBid});log.push(`SOLD! ${p.name} to ${winner} for ${money(r.currentBid)}${r.rtmOutcome==='rtm'?' (RTM)':''}.`)}else unsold.push(p.id)}}else unsold.push(p.id);return advanceAuctionTx(tx,ref,r,p,sold,unsold,log)}
if(r.bidState!=='live')return;const winner=r.leaderTeam;if(winner){const tr=ref.collection('teams').doc(winner),ts=await tx.get(tr);if(!ts.exists)return;const t=ts.data();if(t.purse<r.currentBid||t.squad.length>=25){log.push(`${p.name} could not be completed and goes unsold.`);unsold.push(p.id)}else if(p.formerTeam&&p.formerTeam!==winner){const oldRef=ref.collection('teams').doc(p.formerTeam),oldSnap=await tx.get(oldRef),oldTeam=oldSnap.exists?oldSnap.data():null;if(oldTeam&&(oldTeam.rtm||0)>0&&oldTeam.purse>=r.currentBid&&oldTeam.squad.length<25){tx.update(ref,{bidState:'rtm_offer',rtmTeam:p.formerTeam,rtmOutcome:null,deadline:Date.now()+8000,log:[...log,`${p.formerTeam} has ${oldTeam.rtm} RTM card(s). Offer to match ${money(r.currentBid)} for ${p.name}.`].slice(-30)});return}else{tx.update(tr,{purse:t.purse-r.currentBid,squad:[...t.squad,{...p,price:r.currentBid,retained:false}]});sold.push({player:p,teamId:winner,price:r.currentBid});log.push(`SOLD! ${p.name} to ${winner} for ${money(r.currentBid)}.`)}}else{tx.update(tr,{purse:t.purse-r.currentBid,squad:[...t.squad,{...p,price:r.currentBid,retained:false}]});sold.push({player:p,teamId:winner,price:r.currentBid});log.push(`SOLD! ${p.name} to ${winner} for ${money(r.currentBid)}.`)}}else{unsold.push(p.id);log.push(`${p.name} goes UNSOLD.`)}return advanceAuctionTx(tx,ref,r,p,sold,unsold,log)})}
function advanceAuctionTx(tx,ref,r,p,sold,unsold,log){const nextIndex=r.playerIndex+1,queue=r.playerQueue||[];if(nextIndex>=queue.length){tx.update(ref,{phase:'done',sold,unsold,currentPlayer:null,leaderTeam:null,bidState:'done',deadline:0,rtmTeam:null,rtmOutcome:null,log:log.slice(-30)});return}const next=playerById(queue[nextIndex]);tx.update(ref,{sold,unsold,playerIndex:nextIndex,currentPlayer:next,currentBid:0,leaderTeam:null,bidState:'live',deadline:Date.now()+12000,rtmTeam:null,rtmOutcome:null,log:[...log,`Up next: ${next?.name||'Next player'}`].slice(-30)})}
async function rtmAction(action){if(!room||!myTeam)return;const ref=db.collection('rooms').doc(roomCode);try{await db.runTransaction(async tx=>{const rs=await tx.get(ref);if(!rs.exists)throw Error('Room not found');const r=rs.data();if(r.phase!=='auction'||Date.now()>r.deadline)throw Error('Decision window has ended.');const p=r.currentPlayer;if(r.bidState==='rtm_offer'){if(myTeam!==r.rtmTeam)throw Error('Only the former franchise can decide.');if(action==='accept'){tx.update(ref,{bidState:'rtm_raise',deadline:Date.now()+8000,log:firebase.firestore.FieldValue.arrayUnion(`${myTeam} activates RTM. ${r.leaderTeam} may raise once.`)})}else{tx.update(ref,{bidState:'rtm_final',rtmOutcome:'leader',deadline:Date.now(),log:firebase.firestore.FieldValue.arrayUnion(`${myTeam} declines RTM for ${p.name}.`)})}return}if(r.bidState==='rtm_raise'){if(myTeam!==r.leaderTeam)throw Error('Only the current highest bidder can raise.');if(action==='raise'){const amount=Number(document.getElementById('rtmRaiseAmount')?.value);const team=teamsState[myTeam];if(!Number.isFinite(amount)||amount<=r.currentBid||!team||amount>team.purse)throw Error('Enter a higher bid within your remaining purse.');tx.update(ref,{currentBid:amount,bidState:'rtm_final',rtmOutcome:null,deadline:Date.now()+8000,log:firebase.firestore.FieldValue.arrayUnion(`${myTeam} raises to ${money(amount)}. Final decision goes to ${r.rtmTeam}.`)})}else{tx.update(ref,{bidState:'rtm_final',rtmOutcome:'rtm',deadline:Date.now(),log:firebase.firestore.FieldValue.arrayUnion(`${myTeam} passes. RTM team can match ${money(r.currentBid)}.`)})}return}if(r.bidState==='rtm_final'){if(myTeam!==r.rtmTeam)throw Error('Only the RTM team can make the final decision.');if(action==='match'&&(!teamsState[myTeam]||teamsState[myTeam].purse<r.currentBid))throw Error('Your remaining purse is too low to match this bid.');tx.update(ref,{bidState:'rtm_final',rtmOutcome:action==='match'?'rtm':'leader',deadline:Date.now(),log:firebase.firestore.FieldValue.arrayUnion(action==='match'?`${myTeam} matches the final bid with RTM.`:`${myTeam} declines the final RTM match.`)});return}throw Error('No RTM decision is waiting.');})}catch(e){alert(e.message)}}
async function resetRoom(){if(!isHost||!confirm('Reset this room and clear its auction progress?'))return;try{const ref=db.collection('rooms').doc(roomCode),batch=db.batch();batch.update(ref,{phase:'lobby',playerIndex:-1,currentPlayer:null,currentBid:0,leaderTeam:null,deadline:0,bidState:'idle',rtmTeam:null,rtmOutcome:null,sold:[],unsold:[],log:['Room reset by host.']});TEAMS.forEach((t,i)=>batch.set(ref.collection('teams').doc(t.id),createInitialTeam(i)));await batch.commit()}catch(e){alert(e.message)}}
async function closeRoom(){clearRoomListeners();home()}
function renderRoom(){if(!room)return;if(room.phase==='lobby'){renderLobby();return}if(room.phase==='retention'){renderRetention();return}renderAuction()}
function renderRetention(){const idx=myTeam?TEAMS.findIndex(t=>t.id===myTeam):-1,candidates=idx>=0?(RETENTIONS[idx]||[]):[],team=myTeam?teamsState[myTeam]:null,choices=team?.retentionChoices||[];app.innerHTML=`<div class="layout"><section class="card full"><div class="broadcastbar"><div><div class="eyebrow" style="color:#cbd5ee">IPL MEGA AUCTION · PRE-AUCTION</div><h1 class="title" style="color:white;margin:0">Retention Window</h1><div class="small" style="color:#cbd5ee">Choose your core squad before the bidding begins.</div></div><div class="roomcode" style="color:var(--gold)">${esc(roomCode)}</div></div><div class="notice">Mock 2025-style rules: up to 6 retentions, maximum 5 capped and 2 uncapped, with RTM cards remaining based on the number retained. Retention costs are deducted when the host starts the main auction.</div></section><section class="card"><div class="eyebrow">Your franchise</div><h2 class="title">${myTeam?teamById(myTeam).name:'Spectator view'}</h2>${myTeam?`<p class="muted">Select up to six players from the franchise retention shortlist. Saving your choices does not start the auction.</p><div class="retainlist">${candidates.map((p,i)=>`<label class="retainitem"><input type="checkbox" name="retpick" value="${i}" ${choices.some(c=>c.name===p.name)?'checked':''} onchange="retentionLimit(this)"><span><b>${esc(p.name)}</b><span class="small muted">${esc(p.role)} · ${esc(p.country==='IN'?'India':p.country)} · ${isUncappedRetention(p)?'Uncapped':'Capped'} candidate</span></span></label>`).join('')}</div><div class="actions"><button class="btn" onclick="saveRetentionChoices()">Save Retentions</button><button class="btn secondary" onclick="becomeSpectator()">Spectate instead</button></div><p class="small muted">${choices.length} saved · RTM cards after selection: ${Math.max(0,6-choices.length)}</p>`:`<p class="muted">You are spectating. Team owners can select retentions here.</p>`}</section><section class="card"><div class="eyebrow">Host controls</div><h2 class="title">Start the main auction</h2><p class="muted">Unclaimed AI teams will use their full retention shortlist. Claimed teams use the choices saved by their owner; teams without saved choices start with no retentions.</p>${isHost?`<button class="btn" onclick="launchMainAuction()">Start Main Auction →</button>`:`<div class="status">Waiting for the host to start the main auction.</div>`}<div class="eyebrow" style="margin-top:18px">Franchise status</div><div class="tablewrap"><table><thead><tr><th>Team</th><th>Owner</th><th>Saved</th><th>RTM after</th></tr></thead><tbody>${TEAMS.map((t,i)=>{const d=teamsState[t.id]||createInitialTeam(i),n=(d.retentionChoices||[]).length;return `<tr><td>${t.id}</td><td>${esc(d.ownerName||'AI')}</td><td>${n}/6</td><td>${6-n}</td></tr>`}).join('')}</tbody></table></div><div class="actions"><button class="btn secondary" onclick="closeRoom()">Leave room</button></div></section></div>`}
function retentionLimit(el){const picks=[...document.querySelectorAll('input[name=retpick]:checked')];if(picks.length>6){el.checked=false;alert('Maximum six retentions per team.')}}
function renderLobby(){const joined=TEAMS.filter(t=>teamsState[t.id]?.ownerUid).length;app.innerHTML=`<div class="layout"><section class="card full"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Waiting room</div><h1 class="title">Invite your friends</h1><div class="muted">Share this code so others can join this auction.</div></div><div class="roomcode">${esc(roomCode)}</div></div><div class="actions"><button class="btn secondary" onclick="navigator.clipboard?.writeText('${roomCode}').then(()=>alert('Room code copied!')).catch(()=>alert('Room code: ${roomCode}'))">Copy room code</button><span class="status">${joined}/10 teams claimed</span></div></section><section class="card"><div class="eyebrow">Select your franchise</div><h2 class="title">Choose one team</h2><div class="teamgrid">${TEAMS.map(t=>{const d=teamsState[t.id]||createInitialTeam(TEAMS.indexOf(t)),owned=!!d.ownerUid;return `<button class="teamchoice ${myTeam===t.id?'selected':''}" onclick="claimTeam('${t.id}')" ${owned&&d.ownerUid!==user.uid?'disabled':''}><strong><i class="teamdot" style="background:${t.color}"></i>${t.name}</strong><small>${owned?esc(d.ownerName):'Available to claim'} · ${money(d.purse)}</small></button>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="becomeSpectator()">Join as spectator</button><button class="btn secondary" onclick="closeRoom()">Leave room</button></div></section><section class="card"><div class="eyebrow">Host controls</div><h2 class="title">Ready to start?</h2><p class="muted">Unclaimed franchises are controlled by simple AI bidders. The host opens a retention phase first; each franchise can choose its retained players before the main auction.</p>${isHost?`<button class="btn" onclick="startAuction()">Open Retention Phase →</button><p class="small muted">Starting the auction will prevent team changes.</p>`:`<div class="status">Waiting for the host to start the auction…</div>`}<div class="notice" style="margin-top:15px">Each room updates live through Firebase. For actual online multiplayer, every participant must use the same hosted app and room code.</div></section></div>`}
function renderAuction(){const p=room.currentPlayer,leader=room.leaderTeam?teamById(room.leaderTeam):null,team=myTeam?teamsState[myTeam]:null,can=!!(team&&p&&room.phase==='auction'&&room.bidState==='live'&&room.leaderTeam!==myTeam&&team.purse>=nextBid()&&team.squad.length<25&&(isIndian(p.country)||overseasCount(team)<8));const sold=room.sold||[];const myRank=[...TEAMS].map(t=>({t,d:teamsState[t.id]||createInitialTeam(TEAMS.indexOf(t))})).sort((a,b)=>b.d.squad.length-a.d.squad.length);app.innerHTML=`<div class="layout"><section class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${room.phase==='done'?'Auction completed':'Live player auction'}</div><h1 class="title">${room.phase==='done'?'Final Results':'Player on the block'}</h1></div><span class="status">Room ${esc(roomCode)}</span></div>${p?`<div class="playerhero"><div class="eyebrow" style="color:#b7c8f0">PLAYER ${(room.playerIndex||0)+1} / ${(room.playerQueue||[]).length}</div><div class="playername">${esc(p.name)}</div><div class="playerrole">${esc(p.role==='BAT'?'Batter':p.role==='BOWL'?'Bowler':p.role==='WK'?'Wicketkeeper':'All-rounder')} · ${esc(p.country==='IN'?'India':p.country)}</div><div class="tagrow" style="margin-top:10px"><span class="pill">${esc(p.set)} set</span><span class="pill">Base ${money(p.base)}</span></div><div class="bidamount">${money(room.currentBid||p.base)}</div><div class="bidstatus">${leader?`Highest bid: ${leader.name}`:'No bids yet'}</div><div class="timer"><div class="timerbar" id="timerbar"></div></div><div id="timerlabel" class="small" style="color:#d5def3;margin-top:6px">${room.phase==='auction'?'Bidding is live':'Auction complete'}</div></div>${room.phase==='auction'?`${room.bidState==='rtm_offer'&&myTeam===room.rtmTeam?`<div class="rtm-panel"><b>RIGHT TO MATCH</b><p>${esc(myTeam)} can match ${money(room.currentBid)} for ${esc(p.name)}.</p><button class="btn" onclick="rtmAction('accept')">Use RTM</button><button class="btn secondary" onclick="rtmAction('decline')">Decline</button></div>`:room.bidState==='rtm_raise'&&myTeam===room.leaderTeam?`<div class="rtm-panel"><b>RTM ACTIVATED — FINAL RAISE</b><p>You may raise the bid once. If you pass, the former team can match the current amount.</p><input class="field" id="rtmRaiseAmount" type="number" min="${room.currentBid+5}" step="5" value="${room.currentBid+inc(room.currentBid)}"><button class="btn" onclick="rtmAction('raise')">Raise once</button><button class="btn secondary" onclick="rtmAction('pass')">Pass</button></div>`:room.bidState==='rtm_final'&&myTeam===room.rtmTeam?`<div class="rtm-panel"><b>FINAL RTM DECISION</b><p>Match ${money(room.currentBid)} to sign ${esc(p.name)}.</p><button class="btn" onclick="rtmAction('match')">Match final bid</button><button class="btn secondary" onclick="rtmAction('decline')">Decline</button></div>`:`<div class="actions"><button class="btn" onclick="placeBid()" ${can?'':'disabled'}>Bid ${money(nextBid())}</button><span class="muted small">${myTeam?`Your team: ${teamById(myTeam).name} · Purse ${money(team?.purse||0)}`:'Spectator mode — choose a team in the lobby to bid.'}</span></div>`}`:''}`:`<div class="notice">The auction has ended. Review the final rankings and squads below.</div>`}<div class="twocol" style="margin-top:16px"><div class="statbox"><span class="muted small">Players sold</span><b>${sold.length}</b></div><div class="statbox"><span class="muted small">Players unsold</span><b>${(room.unsold||[]).length}</b></div></div><div class="eyebrow" style="margin-top:18px">Auction activity</div><div class="log">${(room.log||[]).slice(-12).reverse().map(x=>`<div>${esc(x)}</div>`).join('')||'<div>No activity yet.</div>'}</div><div class="actions">${isHost&&room.phase==='auction'?`<button class="btn secondary" onclick="pauseAuction()">Pause auction</button><button class="btn" onclick="resumeAuction()">Resume auction</button><button class="btn secondary" onclick="hostSkip()">Skip / Sell as unsold</button>`:''}${isHost?`<button class="btn secondary" onclick="resetRoom()">Reset room</button>`:''}<button class="btn secondary" onclick="closeRoom()">Leave room</button></div></section><section class="card"><div class="eyebrow">Live standings</div><h2 class="title">Franchise purses</h2><div class="tablewrap"><table><thead><tr><th>Team</th><th>Purse</th><th>Squad</th><th>OS</th></tr></thead><tbody>${TEAMS.map(t=>{const d=teamsState[t.id]||createInitialTeam(TEAMS.indexOf(t));return `<tr><td><i class="teamdot" style="background:${t.color}"></i>${t.id}${d.ownerUid===user.uid?' ★':''}</td><td>${money(d.purse)}</td><td>${d.squad.length}/25</td><td>${overseasCount(d)}/8</td></tr>`}).join('')}</tbody></table></div><div class="eyebrow" style="margin-top:20px">Team squad viewer</div><select class="field" id="squadSelect" onchange="viewTeam=this.value;renderSquad()">${TEAMS.map(t=>`<option value="${t.id}" ${viewTeam===t.id?'selected':''}>${t.name}</option>`).join('')}</select><div id="squadView"></div></section>${room.phase==='done'?`<section class="card full"><div class="eyebrow">Final results</div><h2 class="title">Auction leaderboard</h2><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Team</th><th>Owner</th><th>Squad</th><th>Purse remaining</th></tr></thead><tbody>${[...TEAMS].sort((a,b)=>(teamsState[b.id]?.squad.length||0)-(teamsState[a.id]?.squad.length||0)).map((t,i)=>{const d=teamsState[t.id]||createInitialTeam(TEAMS.indexOf(t));return `<tr><td>${i+1}</td><td>${t.name}</td><td>${esc(d.ownerName||'AI')}</td><td>${d.squad.length}</td><td>${money(d.purse)}</td></tr>`}).join('')}</tbody></table></div></section>`:''}</div>`;renderSquad();updateTimer()}
function renderSquad(){const target=document.getElementById('squadView');if(!target)return;const id=document.getElementById('squadSelect')?.value||viewTeam,d=teamsState[id]||createInitialTeam(TEAMS.findIndex(t=>t.id===id));viewTeam=id;target.innerHTML=`<div class="statbox" style="margin-bottom:10px"><span class="muted small">${teamById(id).name}</span><b>${d.squad.length} players</b><span class="muted small">Purse left: ${money(d.purse)}</span></div><div class="tablewrap"><table><thead><tr><th>Player</th><th>Role</th><th>Price</th></tr></thead><tbody>${(d.squad||[]).map(p=>`<tr><td>${esc(p.name)}${p.retained?' <span class="pill">Retained</span>':''}</td><td>${esc(p.role)}</td><td>${money(p.price)}</td></tr>`).join('')||'<tr><td colspan="3">No players yet.</td></tr>'}</tbody></table></div>`}
function updateTimer(){if(!room||room.phase!=='auction')return;if(room.bidState==='paused'){const pb=document.getElementById('timerbar'),pl=document.getElementById('timerlabel');if(pb)pb.style.width='0%';if(pl)pl.textContent='Auction paused by host';return}const bar=document.getElementById('timerbar'),label=document.getElementById('timerlabel');if(!bar)return;const left=Math.max(0,room.deadline-Date.now()),pct=Math.min(100,left/12000*100);bar.style.width=pct+'%';if(label)label.textContent=left>0?`${room.bidState==='rtm_offer'?'RTM offer':room.bidState==='rtm_raise'?'Highest bidder raise':room.bidState==='rtm_final'?'Final RTM decision':'Bidding'} closes in ${Math.ceil(left/1000)} seconds`:'Closing auction…'}
async function pauseAuction(){if(!isHost||!room||room.phase!=='auction'||room.bidState==='paused')return;try{await db.collection('rooms').doc(roomCode).update({pausedFrom:room.bidState,pausedRemaining:Math.max(1000,(room.deadline||Date.now())-Date.now()),bidState:'paused',deadline:0,log:firebase.firestore.FieldValue.arrayUnion('Host paused the auction.')})}catch(e){alert(e.message)}}
async function resumeAuction(){if(!isHost||!room||room.phase!=='auction'||room.bidState!=='paused')return;try{await db.collection('rooms').doc(roomCode).update({bidState:room.pausedFrom||'live',deadline:Date.now()+(room.pausedRemaining||12000),pausedFrom:null,pausedRemaining:null,log:firebase.firestore.FieldValue.arrayUnion('Host resumed the auction.')})}catch(e){alert(e.message)}}
async function hostSkip(){if(!isHost||!room||room.phase!=='auction')return;try{await db.collection('rooms').doc(roomCode).update({deadline:Date.now()-1}) ; await hostTick()}catch(e){alert(e.message)}}
setInterval(updateTimer,250);init();
</script></body></html>
