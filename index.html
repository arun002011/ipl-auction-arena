<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPL Mega Auction Arena</title>
  <style>
    :root{--navy:#07132f;--navy2:#10234d;--orange:#ff6b24;--gold:#ffd166;--bg:#f3f6fb;--card:#fff;--text:#101a32;--muted:#6b7690;--line:#dce3f0;--green:#14804a;--red:#d63333}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif}
    header{background:linear-gradient(120deg,var(--navy),#172d62);color:#fff;padding:17px max(18px,calc((100% - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--orange)}
    .brand{font-weight:900;font-size:21px;letter-spacing:.4px}
    .brand span{color:var(--gold)}
    .headmeta{font-size:13px;color:#cbd5ee}
    main{max-width:1240px;margin:22px auto;padding:0 16px}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 7px 22px #13264a0a}
    .full{grid-column:1/-1}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .title{font-size:23px;margin:0 0 8px}
    .muted{color:var(--muted)}
    .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;margin:5px 0 10px;color:var(--text)}
    .btn{border:0;border-radius:10px;background:var(--orange);color:white;font-weight:800;padding:12px 16px;font:inherit;cursor:pointer;box-shadow:0 4px 10px #ff6b2425}
    .btn.secondary{background:#edf1f8;color:var(--text);box-shadow:none}
    .btn.dark{background:var(--navy2)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .teamgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .teamchoice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:var(--text);min-width:0}
    .teamchoice strong{display:block}
    .teamchoice small{color:var(--muted)}
    .teamchoice.selected{border:2px solid var(--orange);background:#fff8f3}
    .pill{display:inline-flex;align-items:center;border-radius:100px;background:#eef2f9;padding:4px 9px;font-size:12px;font-weight:700;margin:2px}
    .playerhero{background:linear-gradient(140deg,#091532,#18336a);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden}
    .playerhero:after{content:'IPL';position:absolute;right:10px;bottom:-40px;font-size:130px;font-weight:1000;color:#ffffff0b;pointer-events:none}
    .playername{font-size:clamp(25px,3vw,36px);font-weight:900;margin:4px 0}
    .playerrole{color:#c9d5f4}
    .baseprice{font-size:13px;color:#c9d5f4}
    .bidamount{font-size:clamp(34px,5vw,48px);font-weight:1000;color:var(--gold);margin:8px 0}
    .bidstatus{font-weight:800;color:#fff}
    .timer{height:8px;border-radius:99px;background:#ffffff26;overflow:hidden;margin-top:15px}
    .timerbar{height:100%;background:var(--orange);width:100%;transition:width .2s linear}
    .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .statbox{background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:12px}
    .statbox b{font-size:20px;display:block}
    .sectiontitle{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
    .tablewrap{overflow:auto;max-height:360px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
    .teamdot{display:inline-block;width:100px;height:10px;border-radius:50%;margin-right:7px}
    .log{max-height:190px;overflow:auto;font-size:13px}
    .log div{padding:7px 0;border-bottom:1px dashed var(--line)}
    .status{padding:8px 11px;border-radius:99px;background:#eaf7ef;color:var(--green);font-size:13px;font-weight:700}
    .error{color:var(--red)}
    .hidden{display:none!important}
    .footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
    .roomcode{font-size:34px;font-weight:1000;letter-spacing:5px;color:var(--orange)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.full{grid-column:auto}}
    @media(max-width:480px){main{padding:0 10px}.card{padding:14px}.teamgrid{grid-template-columns:1fr}.twocol{grid-template-columns:1fr 1fr}header{padding:14px}}
  </style>
</head>
<body>
<header>
  <div class="brand"><span>IPL</span> AUCTION ARENA</div>
  <div class="headmeta" id="headerStatus">Multiplayer mock auction · fan-made project</div>
</header>
<main>
  <div id="app">
    <section class="card full">
      <h2>Loading Auction Arena…</h2>
      <p class="muted">Connecting to the auction service.</p>
    </section>
  </div>
</main>
<div class="footer">Fan-made IPL mock auction project. Not affiliated with the BCCI or IPL.</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyApyrrX6gwt5MXD5Pu6TmnewBNtuDVKHVo",
    authDomain: "ipl-arena-2bdcc.firebaseapp.com",
    projectId: "ipl-arena-2bdcc",
    storageBucket: "ipl-arena-2bdcc.firebasestorage.app",
    messagingSenderId: "795621438551",
    appId: "1:795621438551:web:4faeb0d0d98e6487d81f12"
  };

  const TEAMS = [
    {"id": "CSK", "name": "Chennai Super Kings", "color": "#f4b400"},
    {"id": "MI", "name": "Mumbai Indians", "color": "#1d6fdc"},
    {"id": "RCB", "name": "Royal Challengers Bengaluru", "color": "#d62828"},
    {"id": "KKR", "name": "Kolkata Knight Riders", "color": "#6a3fb5"},
    {"id": "DC", "name": "Delhi Capitals", "color": "#2a6fd0"},
    {"id": "PBKS", "name": "Punjab Kings", "color": "#e03a4e"},
    {"id": "RR", "name": "Rajasthan Royals", "color": "#e5509a"},
    {"id": "SRH", "name": "Sunrisers Hyderabad", "color": "#f2751a"},
    {"id": "GT", "name": "Gujarat Titans", "color": "#2c3e63"},
    {"id": "LSG", "name": "Lucknow Super Giants", "color": "#12a8c9"}
  ];

  const PLAYERS = [
    {"name":"Jos Buttler","role":"WK","country":"England","base":200,"set":"M1","formerTeam":"RR"},
    {"name":"Shreyas Iyer","role":"BAT","country":"IN","base":200,"set":"M1","formerTeam":"KKR"},
    {"name":"Rishabh Pant","role":"WK","country":"IN","base":200,"set":"M1","formerTeam":"DC"},
    {"name":"Kagiso Rabada","role":"BOWL","country":"South Africa","base":200,"set":"M1","formerTeam":"PBKS"},
    {"name":"Arshdeep Singh","role":"BOWL","country":"IN","base":200,"set":"M1","formerTeam":"PBKS"},
    {"name":"Mitchell Starc","role":"BOWL","country":"Australia","base":200,"set":"M1","formerTeam":"KKR"},
    {"name":"Yuzvendra Chahal","role":"BOWL","country":"IN","base":200,"set":"M2","formerTeam":"RR"},
    {"name":"KL Rahul","role":"WK","country":"IN","base":200,"set":"M2","formerTeam":"LSG"},
    {"name":"Mohammad Shami","role":"BOWL","country":"IN","base":200,"set":"M2","formerTeam":"GT"},
    {"name":"Mohammed Siraj","role":"BOWL","country":"IN","base":200,"set":"M2","formerTeam":"RCB"}
  ];

  let db, auth, currentUser, currentRoomId, unsubscribeRoom;

  // Initialize Firebase
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();

    auth.signInAnonymously().then((userCred) => {
      currentUser = userCred.user;
      initAppUI();
    }).catch(err => {
      showError("Auth Error: " + err.message);
    });
  } catch(e) {
    console.error("Firebase init error:", e);
    showError("Failed to initialize Firebase: " + e.message);
  }

  function showError(msg) {
    document.getElementById('app').innerHTML = `
      <section class="card full">
        <h2 class="title error">Error</h2>
        <p class="muted">${msg}</p>
      </section>
    `;
  }

  function initAppUI() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <section class="card full">
        <div class="eyebrow">IPL Auction Lobby</div>
        <h2 class="title">Join or Create Room</h2>
        <div class="row" style="margin-top:15px;">
          <button class="btn" onclick="createRoom()">Create New Room</button>
          <div style="display:flex;gap:8px;">
            <input type="text" id="roomCodeInput" class="field" style="margin:0;width:140px;text-transform:uppercase;" placeholder="ROOM CODE">
            <button class="btn secondary" onclick="joinRoom()">Join Room</button>
          </div>
        </div>
      </section>
    `;
  }

  function generateRoomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    let code = "";
    for (let i = 0; i < 5; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return code;
  }

  async function createRoom() {
    const roomCode = generateRoomCode();
    const initialTeams = {};
    TEAMS.forEach(t => {
      initialTeams[t.id] = { claimedBy: null, purse: 120, players: [] };
    });

    const roomData = {
      code: roomCode,
      hostId: currentUser.uid,
      status: "LOBBY",
      teams: initialTeams,
      currentPlayerIndex: 0,
      currentBid: 0,
      currentBidder: null,
      timerEnd: null,
      logs: ["Room created successfully."]
    };

    try {
      await db.collection("rooms").doc(roomCode).set(roomData);
      listenToRoom(roomCode);
    } catch(e) {
      alert("Error creating room: " + e.message);
    }
  }

  async function joinRoom() {
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!code) return alert("Please enter room code!");
    
    const snap = await db.collection("rooms").doc(code).get();
    if (snap.exists) {
      listenToRoom(code);
    } else {
      alert("Room not found!");
    }
  }

  function listenToRoom(roomCode) {
    currentRoomId = roomCode;
    if (unsubscribeRoom) unsubscribeRoom();

    unsubscribeRoom = db.collection("rooms").doc(roomCode).onSnapshot((docSnap) => {
      if (!docSnap.exists) {
        alert("Room closed or deleted.");
        initAppUI();
        return;
      }
      renderRoomState(docSnap.data());
    }, (err) => {
      console.error("Room listener error:", err);
    });
  }

  async function claimTeam(teamId) {
    if (!currentRoomId) return;
    try {
      const roomRef = db.collection("rooms").doc(currentRoomId);
      await roomRef.update({
        [`teams.${teamId}.claimedBy`]: currentUser.uid,
        logs: firebase.firestore.FieldValue.arrayUnion(`User claimed team ${teamId}`)
      });
    } catch(e) {
      alert("Failed to claim team: " + e.message);
    }
  }

  async function startAuction() {
    if (!currentRoomId) return;
    const p = PLAYERS[0];
    try {
      await db.collection("rooms").doc(currentRoomId).update({
        status: "AUCTION",
        currentPlayerIndex: 0,
        currentBid: p.base,
        currentBidder: null,
        logs: firebase.firestore.FieldValue.arrayUnion(`Auction started! First player: ${p.name}`)
      });
    } catch(e) {
      alert("Error starting auction: " + e.message);
    }
  }

  async function placeBid() {
    if (!currentRoomId) return;
    const snap = await db.collection("rooms").doc(currentRoomId).get();
    const data = snap.data();
    
    // Find user's claimed team
    let userTeamId = null;
    for (const [tid, tdata] of Object.entries(data.teams)) {
      if (tdata.claimedBy === currentUser.uid) {
        userTeamId = tid;
        break;
      }
    }

    if (!userTeamId) {
      alert("You must claim a team before bidding!");
      return;
    }

    const nextBid = data.currentBidder ? data.currentBid + 20 : data.currentBid;
    
    if (data.teams[userTeamId].purse < nextBid) {
      alert("Not enough purse remaining!");
      return;
    }

    await db.collection("rooms").doc(currentRoomId).update({
      currentBid: nextBid,
      currentBidder: userTeamId,
      logs: firebase.firestore.FieldValue.arrayUnion(`${userTeamId} bid ₹${nextBid} Lakhs`)
    });
  }

  function renderRoomState(data) {
    const app = document.getElementById('app');
    document.getElementById('headerStatus').innerText = `Room: ${data.code} · Status: ${data.status}`;

    let claimedCount = 0;
    Object.values(data.teams).forEach(t => { if (t.claimedBy) claimedCount++; });

    if (data.status === "LOBBY") {
      app.innerHTML = `
        <div class="layout">
          <section class="card">
            <div class="eyebrow">Waiting Room</div>
            <h2 class="title">Invite your friends</h2>
            <div class="roomcode">${data.code}</div>
            <p class="muted">${claimedCount}/10 teams claimed</p>
            <hr style="border:0;border-top:1px solid var(--line);margin:15px 0;">
            <div class="sectiontitle">Select Your Franchise</div>
            <div class="teamgrid">
              ${TEAMS.map(t => {
                const teamData = data.teams[t.id];
                const isMine = teamData.claimedBy === currentUser.uid;
                const isClaimed = !!teamData.claimedBy;
                return `
                  <button class="teamchoice ${isMine ? 'selected' : ''}" 
                          ${isClaimed && !isMine ? 'disabled' : ''} 
                          onclick="claimTeam('${t.id}')">
                    <strong><span class="teamdot" style="background:${t.color}"></span>${t.name}</strong>
                    <small>${isMine ? 'Claimed by You' : isClaimed ? 'Claimed' : 'Available · ₹120 Cr'}</small>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <section class="card">
            <div class="eyebrow">Host Controls</div>
            <h3 class="title">Ready to start?</h3>
            <p class="muted">Unclaimed franchises can be controlled or picked during the auction.</p>
            ${data.hostId === currentUser.uid ? `
              <button class="btn" onclick="startAuction()">Start Auction →</button>
            ` : `
              <p class="status">Waiting for host to start...</p>
            `}
            <div class="sectiontitle" style="margin-top:20px;">Activity Log</div>
            <div class="log">
              ${(data.logs || []).slice().reverse().map(l => `<div>${l}</div>`).join('')}
            </div>
          </section>
        </div>
      `;
    } else if (data.status === "AUCTION") {
      const player = PLAYERS[data.currentPlayerIndex] || PLAYERS[0];
      app.innerHTML = `
        <div class="layout">
          <section class="card">
            <div class="playerhero">
              <div class="playerrole">${player.role} · ${player.country}</div>
              <div class="playername">${player.name}</div>
              <div class="baseprice">Base Price: ₹${player.base} Lakhs</div>
              <div class="bidamount">₹${data.currentBid} L</div>
              <div class="bidstatus">${data.currentBidder ? 'Highest Bidder: ' + data.currentBidder : 'No Bids Yet'}</div>
            </div>
            <div class="actions">
              <button class="btn" onclick="placeBid()">Place Bid</button>
            </div>
          </section>

          <section class="card">
            <div class="sectiontitle">Live Activity</div>
            <div class="log">
              ${(data.logs || []).slice().reverse().map(l => `<div>${l}</div>`).join('')}
            </div>
          </section>
        </div>
      `;
    }
  }
</script>
</body>
</html>
